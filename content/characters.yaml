# 主人公（付録B-43）。主人公は1人で、属性は画面で選ぶ（src/engine/profile.ts）。
# initial ははじめのパラメーターの基準。家計や家庭の条件で profile.ts の initialOf が変える（T3：監修で調整する）。
- id: me
  name: あなた
  initial: { body: 60, safety: 60, psychSafety: 60, options: 60, connection: 50, autonomy: 55, living: 55 }
  statRefs: []
  # 人との距離（付録B-9）：近しい人、はじめの近さ（0〜3）、登場する年齢
  bonds:
    - { id: riko, initial: 2, from: 16 }
    - { id: sou, initial: 1, from: 16, when: "flags.partnerId == 'sou'" }
    - { id: saki, initial: 1, from: 16, when: "flags.partnerId == 'saki'" }
