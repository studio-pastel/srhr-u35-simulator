# 登場人物の見た目（SPEC.md 付録B-1・B-5）。色と髪型は暫定値。パステルが選んで決める。
# 髪型や服装で、性別のステレオタイプに寄せない（監修で確認する）。
# 主人公の年齢は周回の年齢を使う。脇役は age の年齢で描く。peerOffset は主人公と一緒に年をとる（主人公の年齢＋差）。
# 家族（親・きょうだい）は peerOffset にして、主人公と一緒に年をとった姿を描く。
# hairStyle：short／mid／bob／long／tied（結んだ髪）
# clothes：[〜19歳, 20〜30歳, 31歳〜] の服の色
# tie：常に出す小さな関係図での関係（付録B-53）。付き合うと「恋人」、別れると「元恋人」に変わる
# about／circle：人物の一覧（付録B-52）に出す、ひとことの説明と分け方（family：家族／friends：交友関係／other：その他）。about がある人だけを出す
# accessory：持ち物（glasses／cap／headphones／beanie。付録B-36）。accent はその色

