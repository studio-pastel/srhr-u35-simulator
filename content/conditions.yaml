# 社会条件（SPEC.md §10.2）。既定値は設計値であり、日本の多数派を表すものではない。
- id: sexEducation
  label: "学校の性教育"
  options:
    - id: taught
      label: "避妊・同意・デートDV・相談窓口を学校で学んだ"
      statRefs: [S06, S09]
      verified: true
      # E16-ALL-SEXED の開始時に反映する（付録A-5）
      setFlags:
        knowsConsent: true
        knowsDateDV: true
        knowsWithdrawalUnreliable: true
        knowsHelplines: true
    - id: notTaught
      label: "学校では学ばなかった"
      statRefs: [S06, S09]
      verified: true
      setFlags:
        knowsConsent: false
        knowsDateDV: false
        knowsWithdrawalUnreliable: false
        knowsHelplines: false
  defaultOption: taught
  affects: [me]
- id: ecAccess
  label: "緊急避妊薬の入手"
  options:
    - id: otc2026
      label: "薬局で処方箋なしで買える"
      statRefs: [S11]
      verified: true
    - id: prescriptionOnly
      label: "受診して処方を受ける必要がある（2026年2月以前）"
      statRefs: [S11]
      verified: true
  defaultOption: otc2026
  affects: []
- id: parentalLeave
  label: "職場の育児休業"
  options:
    - id: easy
      label: "育休を取りやすい職場"
      statRefs: [S21]
      verified: false
    - id: hard
      label: "育休を取りにくい職場"
      statRefs: [S21]
      verified: false
  defaultOption: hard
  affects: []
- id: partnership
  label: "自治体のパートナーシップ制度"
  description: "既定では、24歳でユウが住む場所によって決まる（付録A-17）。2周目では「制度あり／制度なし」に固定して比べられる"
  options:
    - id: byResidence
      label: "住む場所しだい（制度のある自治体を選ぶか、人口カバー率92.5%にもとづく偶然で決まる）"
      statRefs: [S29]
      verified: false
    - id: available
      label: "どこに住んでも制度がある"
      statRefs: [S29]
      verified: false
    - id: notAvailable
      label: "どこにも制度がない"
      statRefs: [S29]
      verified: false
  defaultOption: byResidence
  affects: []
