# 社会条件（SPEC.md §10.2）。既定値は設計値であり、日本の多数派を表すものではない。
- id: sexEducation
  label: "学校の性教育"
  options:
    - id: taught
      label: "避妊・同意・デートDV・相談窓口を学校で学んだ"
      statRefs: [S06, S09]
      verified: true
      # E16-ALL-SEXED の開始時に反映する（付録A-5）
      setFlags:
        knowsConsent: true
        knowsDateDV: true
        knowsWithdrawalUnreliable: true
        knowsHelplines: true
    - id: notTaught
      label: "学校では学ばなかった"
      statRefs: [S06, S09]
      verified: true
      setFlags:
        knowsConsent: false
        knowsDateDV: false
        knowsWithdrawalUnreliable: false
        knowsHelplines: false
  defaultOption: taught
  affects: [minami, haruto, yu, kei]
