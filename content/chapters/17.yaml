            notHappens: { next: quiet }
      - id: quiet
        lines:
          - { who: narration, text: "何事もなく、季節が過ぎていった。" }
        next: END
      - id: happened
        lines:
          - { who: narration, text: "部活の先輩とのあいだで、望まないことがあった。" }
          - { who: self, kind: inner, text: "（断れなかった。……自分が悪かったのかな）", face: sad }
          - { who: narration, text: "性暴力は、誰にでも起こり得る。あなたのせいではない。" }
