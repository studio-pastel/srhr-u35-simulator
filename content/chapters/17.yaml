# 17歳の章（SPEC.md §10.3）。会話中心の形式（付録B-2）。Claude Code の下書き。すべて status: draft。
#
# 文字数の上限（src/engine/limits.ts）
#   吹き出し lines[].text …… 40字以内（超えると警告）
#   選択肢 label ………………… 30字以内（超えると警告）
#   効果 note ………………………… 20字以内（超えるとエラー。ビルドが止まる）
#   とばしたときの要約 summary … 40字以内（超えると警告）
#   数え方：ルビ {漢字|かんじ} は親文字だけを数える。
#
# lines[].kind … say（省略時）／inner（心の声）／message（メッセージ）／narration（地の文）／fade（暗転。付録B-30）
#
# 相手の視点（付録B-11）：viewpointSwitch のあるイベントでは、主人公の場面が終わったあとに
#   「そのころ、〇〇は……」が出て、のぞいたときだけ相手の視点を読む。相手の視点は canonical の選択で進む。
#   視点のあるシーンでは who: self を使わない（読む人によって人物が変わるため）。
#
# P7：ミナミの視点（viewpoint: minami）のシーンから、ハルトのフラグ（harutoRoute・harutoControl17・harutoConsent17）を
#   書き換えない。ミナミで遊ぶときは、ハルトの視点はミナミの場面のあとに進むので、ハルトの反応は標準ルートのまま。
#
# 性交渉の場面（付録B-30）：行為は描かず、前後の会話・心の声と暗転で描く。するか・しないかに正解はなく、
#   どちらにも負の効果を付けない。パラメーターは「決め方」に付ける。
age: 17
title: "17歳"
season: "高校2年・夏"
status: draft
intro:
  minami: "高校2年の夏。同じクラスのハルトと付き合い始めて、1か月になる。"
  haruto: "高校2年の夏。同じクラスのミナミと付き合い始めて、1か月になる。"
  yu: "高校2年の夏。SNSで、好きなバンドの話が合う相手ができた。"
  kei: "高校2年の夏。友だちどうしの話題は、恋愛のことが多くなった。"
events:
  # ───────── ミナミとハルト：するかどうか（付録B-30） ─────────
  - id: E17-MH-TALK
    age: 17
    characters: [minami, haruto]
    kind: fixed
    domains: [同意, 避妊の知識]
    viewpointSwitch:
      from: minami
      to: haruto
      entry: { minami: m-start, haruto: h-start }
    statCard: [S32, S34]
    stage: { place: bedroom, time: dusk, cast: [{ id: minami, x: 28 }, { id: haruto, x: 62 }] }
    summary: "ハルトの部屋で、するかどうかを二人で話した。"
    status: draft
    scenes:
      # ── ミナミの視点 ──
      - id: m-start
        viewpoint: minami
        lines:
          - { who: narration, text: "ハルトの家に、初めて遊びに来た。" }
          - { who: haruto, text: "今日、親、夜まで帰ってこないんだ。" }
          - { who: minami, kind: inner, text: "（……それって、そういうこと？）", face: anxious }
          - { who: narration, text: "映画が終わって、ハルトが少し近くに座った。" }
          - { who: haruto, text: "……ミナミ、あのさ。" }
          - { who: haruto, text: "……したいなって、思ってて。" }
          - { who: haruto, text: "でも、ミナミがどう思ってるか、聞きたい。" }
        branches:
          - when: "flags.knowsConsent == true"
            next: m-know
        next: m-unsure
      - id: m-know
        viewpoint: minami
        lines:
          - { who: minami, kind: inner, text: "（したいかどうかは、私が決めていい）" }
          - { who: minami, kind: inner, text: "（いまそう思っても、あとで気持ちが変わってもいい）" }
        next: m-choose
      - id: m-unsure
        viewpoint: minami
        lines:
          - { who: minami, kind: inner, text: "（こういうとき、どうするのが「ふつう」なんだろう）", face: anxious }
        next: m-choose
      - id: m-choose
        viewpoint: minami
        lines:
          - { who: minami, kind: inner, text: "（私は、どうしたい？）" }
        choices:
          - id: notYet
            label: "「まだ、したくない」"
            canonical: true
            neutral: true
            effects:
              - { param: autonomy, sign: 1, size: M, source: choice, note: "気持ちを言えた" }
            setFlags: { minamiFirst17: notYet }
            next: m-notYet
          - id: talk
            label: "「私も。でも、避妊の話をしたい」"
            neutral: true
            effects:
              - { param: autonomy, sign: 1, size: M, source: choice, note: "避妊を話し合えた" }
              - { param: connection, sign: 1, size: S, source: choice, note: "安心して話せた" }
            setFlags: { minamiFirst17: talked }
            next: m-talk
          - id: silent
            label: "何も言えない"
            effects:
              - { param: autonomy, sign: -1, size: S, source: society, statRef: S06, when: "cond.sexEducation == 'notTaught'", note: "学ぶ機会がなかった" }
            setFlags: { minamiFirst17: silent }
            next: m-silent
      - id: m-notYet
        viewpoint: minami
        lines:
          - { who: minami, text: "……まだ、したくない。" }
        # ハルトで遊んで「理由を聞きつづける」を選んだときだけ、ここで分かれる（ミナミで遊ぶときは通らない）
        branches:
          - when: "flags.harutoConsent17 == 'pressed'"
            next: m-pressed
        next: m-respected
      - id: m-respected
        viewpoint: minami
        effects:
          - { param: psychSafety, sign: 1, size: S, source: others, note: "相手が受けとめた" }
        lines:
          - { who: haruto, text: "わかった。言ってくれて、ありがとう。" }
          - { who: minami, kind: inner, text: "（……ちゃんと、聞いてくれた）", face: relieved }
          - { who: narration, text: "そのあとは、お菓子を分けながら、もう1本映画を見た。" }
          - { who: minami, kind: inner, text: "（手をつないでるだけで、なんだか、うれしい）", face: smile }
        next: END
      - id: m-pressed
        viewpoint: minami
        lines:
          - { who: haruto, text: "なんで？　ちょっとだけでも。" }
          - { who: minami, kind: inner, text: "（……こわい。帰りたい）", face: anxious }
          - { who: minami, text: "ごめん。今日は、帰るね。" }
        next: END
      - id: m-talk
        viewpoint: minami
        effects:
          - { param: psychSafety, sign: 1, size: S, source: others, note: "相手が確かめてくれた" }
        lines:
          - { who: minami, text: "私も、したい。……でも、その前に。" }
          - { who: minami, text: "避妊のこと、ちゃんと話したい。" }
          - { who: haruto, text: "うん。コンドーム、ある。……実は、使い方も調べた。" }
          - { who: minami, text: "ふふ。……なんか、緊張するね。" }
          - { who: haruto, text: "おれも。いやだなって思ったら、すぐ言ってね。" }
          - { who: narration, kind: fade, text: "――" }
          - { who: narration, text: "帰り道。夕焼けが、まだ少し残っていた。" }
          - { who: minami, kind: inner, text: "（ちょっと緊張したけど、ちゃんと話せてよかった）" }
          - { who: minami, kind: inner, text: "（……前より、近くなった気がする）", face: smile }
        next: END
      - id: m-silent
        viewpoint: minami
        effects:
          - { param: psychSafety, sign: 1, size: S, source: others, note: "相手が確かめてくれた" }
        lines:
          - { who: narration, text: "何も言えないまま、時間が過ぎる。" }
          - { who: haruto, text: "……迷ってる？" }
          - { who: haruto, text: "無理しなくていいよ。今日は、やめとこっか。" }
          - { who: minami, kind: inner, text: "（……顔に出てたのかな。ちゃんと見てくれてた）" }
          - { who: minami, kind: inner, text: "（次は、自分の言葉で言ってみたい）", face: relieved }
        next: END

      # ── ハルトの視点 ──
      - id: h-start
        viewpoint: haruto
        lines:
          - { who: narration, text: "ミナミが、初めて家に来た。" }
          - { who: haruto, kind: inner, text: "（今日は、親が夜まで帰ってこない）" }
          - { who: haruto, kind: inner, text: "（……したい。でも、ミナミはどう思ってるんだろう）", face: anxious }
        branches:
          - when: "flags.knowsConsent == true"
            next: h-know
        next: h-ask
      - id: h-know
        viewpoint: haruto
        lines:
          - { who: haruto, kind: inner, text: "（自分の気持ちだけで、進めちゃいけない）" }
        next: h-ask
      - id: h-ask
        viewpoint: haruto
        lines:
          - { who: haruto, text: "……ミナミ、あのさ。したいなって、思ってて。" }
          - { who: haruto, text: "でも、ミナミがどう思ってるか、聞きたい。" }
        # ミナミで遊んだときは、ミナミが選んだ答えに合わせて続きを見せる（ハルトの行動は標準ルートのまま）
        branches:
          - when: "flags.minamiFirst17 == 'talked'"
            next: h-talked
          - when: "flags.minamiFirst17 == 'silent'"
            next: h-silent
        next: h-notYet
      - id: h-notYet
        viewpoint: haruto
        lines:
          - { who: minami, text: "……まだ、したくない。" }
          - { who: haruto, kind: inner, text: "（……そっか）" }
        choices:
          - id: accept
            label: "「わかった。言ってくれて、ありがとう」"
            canonical: true
            effects:
              - { param: connection, sign: 1, size: M, source: choice, note: "気持ちを受けとめた" }
              - { param: autonomy, sign: 1, size: S, source: society, statRef: S06, when: "flags.knowsConsent == true", note: "同意を学んでいた" }
            setFlags: { harutoConsent17: respected }
            next: h-accept
          - id: press
            label: "「なんで？　ちょっとだけでも」"
            effects:
              - { param: connection, sign: -1, size: M, source: choice, note: "相手を追いつめた" }
            setFlags: { harutoConsent17: pressed }
            next: h-press
      - id: h-accept
        viewpoint: haruto
        lines:
          - { who: minami, text: "……ちゃんと聞いてくれて、うれしい。", face: smile }
          - { who: narration, text: "そのあとは、お菓子を分けながら、もう1本映画を見た。" }
          - { who: haruto, kind: inner, text: "（しなくても、いっしょにいるだけで楽しい）", face: smile }
        next: END
      - id: h-press
        viewpoint: haruto
        lines:
          - { who: minami, text: "ごめん。今日は、帰るね。", face: anxious }
          - { who: narration, text: "玄関のドアが閉まる音が、やけに大きく聞こえた。" }
          - { who: haruto, kind: inner, text: "（……おれ、いま何をしようとしてた？）", face: sad }
        # 押し切ろうとした側にも、学び直す選択肢を置く（付録B-30、§11-4）
        choices:
          - id: apologize
            label: "ミナミに謝って、話を聞く"
            canonical: true
            effects:
              - { param: autonomy, sign: 1, size: M, source: choice, note: "自分の行動を見直した" }
            next: h-apologize
          - id: blame
            label: "「はっきりしないミナミが悪い」"
            effects:
              - { param: connection, sign: -1, size: S, source: choice, note: "関係がぎくしゃくした" }
            next: h-blame
      - id: h-apologize
        viewpoint: haruto
        lines:
          - { who: haruto, kind: message, text: "さっきはごめん。嫌って言ってくれたのに、聞かなかった。" }
          - { who: minami, kind: message, text: "……うん。次は、ちゃんと聞いてほしい。" }
          - { who: haruto, kind: inner, text: "（「いや」は、説得するものじゃない）" }
        next: END
      - id: h-blame
        viewpoint: haruto
        lines:
          - { who: haruto, kind: inner, text: "（……ミナミがはっきりしないのが悪い）" }
          - { who: narration, text: "その夜、ミナミからのメッセージは来なかった。" }
          - { who: narration, text: "相手の「いや」を受けとめる方法は、あとからでも学べる。" }
        next: END
      - id: h-talked
        viewpoint: haruto
        lines:
          - { who: minami, text: "私も。でも、避妊のこと、ちゃんと話したい。" }
          - { who: haruto, kind: inner, text: "（よかった。言ってくれて）", face: relieved }
          - { who: haruto, kind: inner, text: "（緊張してるの、おれだけじゃなかった）" }
          - { who: narration, kind: fade, text: "――" }
        next: END
      - id: h-silent
        viewpoint: haruto
        lines:
          - { who: narration, text: "ミナミは、何も言わない。" }
          - { who: haruto, kind: inner, text: "（……表情が固い。迷ってるのかな）" }
          - { who: haruto, text: "無理しなくていいよ。今日は、やめとこっか。" }
        next: END

  # ───────── ミナミとハルト：束縛（デートDV） ─────────
  - id: E17-MH-CONTROL
    age: 17
    characters: [minami, haruto]
    kind: fixed
    domains: [デートDV予防, 同意]
    viewpointSwitch:
      from: minami
      to: haruto
      entry: { minami: m-start, haruto: h-start }
    statCard: [S07, S01]
    resources: [violence]
    stage: { place: bedroom, time: night, cast: [{ id: minami, x: 34, pose: phone }] }
    summary: "ハルトに、スマホや予定を確かめられるようになった。"
    status: draft
    scenes:
      # ── ミナミの視点 ──
      - id: m-start
        viewpoint: minami
        # 加害による低下は、ミナミの選択と関係なく「他者の行為」として記録する（付録A-14・A-15）
        effects:
          - { param: psychSafety, sign: -1, size: L, source: others, statRef: S07, note: "交際相手からの束縛" }
        lines:
          - { who: narration, text: "付き合って、2か月。" }
          - { who: haruto, kind: message, text: "心配だから、位置情報、共有しといて。" }
          - { who: haruto, kind: message, text: "あと、今度スマホ見せて。" }
          - { who: minami, kind: inner, text: "（……前は、こんなこと言わなかったのに）", face: anxious }
        next: m-plans
      - id: m-plans
        viewpoint: minami
        lines:
          - { who: narration, text: "週末に、リコと出かける予定を話した夜。" }
          - { who: haruto, kind: message, text: "誰と行くの？" }
          - { who: haruto, kind: message, text: "何時に帰る？" }
          - { who: haruto, kind: message, text: "なんで既読つけないの？" }
        branches:
          - when: "flags.knowsDateDV == true"
            next: m-know
        next: m-choose
      - id: m-know
        viewpoint: minami
        lines:
          - { who: minami, kind: inner, text: "（授業で言ってた。相手の行動を縛ることも、デートDVになりうる）" }
        next: m-choose
      - id: m-choose
        viewpoint: minami
        lines:
          - { who: narration, text: "スマホの通知が、また光る。" }
        choices:
          - id: accept
            label: "言われたとおりにする"
            effects:
              - { param: autonomy, sign: -1, size: S, source: society, statRef: S06, when: "cond.sexEducation == 'notTaught'", note: "学ぶ機会がなかった" }
            setFlags: { minamiResponse17: accepted }
            next: m-accept
          - id: speak
            label: "「見られるのは、嫌だ」"
            canonical: true
            effects:
              - { param: autonomy, sign: 1, size: M, source: choice, note: "違和感を言葉にした" }
              - { param: autonomy, sign: 1, size: S, source: society, statRef: S06, when: "flags.knowsDateDV == true", note: "授業で学んだ言葉がある" }
              - { param: autonomy, sign: -1, size: S, source: society, statRef: S06, when: "cond.sexEducation == 'notTaught'", note: "学ぶ機会がなかった" }
            setFlags: { minamiResponse17: spoke }
            next: m-speak
          - id: friend
            label: "リコに話してみる"
            effects:
              - { param: connection, sign: 1, size: M, source: choice, note: "友人に話した" }
              - { param: safety, sign: 1, size: S, source: society, when: "flags.knowsHelplines == true", note: "相談先を知っている" }
              - { param: autonomy, sign: -1, size: S, source: society, statRef: S06, when: "cond.sexEducation == 'notTaught'", note: "学ぶ機会がなかった" }
            setFlags: { minamiResponse17: toldFriend }
            next: m-friend
      - id: m-accept
        viewpoint: minami
        lines:
          - { who: minami, kind: message, text: "わかった。共有しとくね。" }
          - { who: narration, text: "その場は、静かになった。" }
          - { who: minami, kind: inner, text: "（でも、予定を決めるたびに、ハルトの顔が浮かぶ）", face: sad }
        next: END
      - id: m-speak
        viewpoint: minami
        lines:
          - { who: minami, kind: message, text: "スマホを見られるのは、嫌だ。位置情報も、やめたい。" }
          - { who: narration, text: "返信は、なかなか来ない。" }
          - { who: minami, kind: inner, text: "（どう受け取ったかは、わからない。でも、言えた）" }
        next: END
      - id: m-friend
        viewpoint: minami
        stage: { place: classroom, time: day, cast: [{ id: minami, x: 30 }, { id: riko, x: 64 }] }
        effects:
          - { param: psychSafety, sign: 1, size: M, source: others, note: "友人が受け止めた" }
        lines:
          - { who: narration, text: "次の日の昼休み、リコに話した。" }
          - { who: riko, text: "……それ、ミナミのせいじゃないよ。" }
          - { who: riko, text: "一人で考えなくていいからね。" }
          - { who: minami, kind: inner, text: "（話して、よかった）", face: relieved }
        next: END

      # ── ハルトの視点 ──
      - id: h-start
        viewpoint: haruto
        stage: { place: bedroom, time: night, cast: [{ id: haruto, x: 34, pose: phone }] }
        lines:
          - { who: narration, text: "ミナミと付き合って、2か月。" }
          - { who: haruto, kind: inner, text: "（返信が少し遅れるだけで、落ち着かない）", face: anxious }
          - { who: haruto, kind: inner, text: "（位置情報を見ると、ほっとする）" }
        next: h-think
      - id: h-think
        viewpoint: haruto
        lines:
          - { who: narration, text: "隣の部屋から、父の声が聞こえる。" }
          - { who: narration, text: "「スマホ見せろ。誰とやり取りしてる」" }
          - { who: haruto, kind: inner, text: "（……これが「大切にする」ってことだと、どこかで思ってた）" }
        branches:
          - when: "flags.knowsDateDV == true"
            next: h-know
        next: h-choose
      - id: h-know
        viewpoint: haruto
        lines:
          - { who: haruto, kind: inner, text: "（授業で言ってた。相手の行動を縛ることも、デートDVになりうる）" }
        next: h-choose
      - id: h-choose
        viewpoint: haruto
        lines:
          - { who: narration, text: "ミナミに送るメッセージを、打ちかけて止める。" }
        choices:
          - id: keepChecking
            label: "「心配だから」と確かめつづける"
            canonical: true
            effects:
              - { param: connection, sign: -1, size: S, source: choice, note: "関係が窮屈になる" }
              - { param: autonomy, sign: -1, size: S, source: upbringing, statRef: S04, when: "up.witnessedDV == true", note: "支配を見て育った" }
            setFlags: { harutoControl17: continued }
            next: h-continue
          - id: stop
            label: "確かめるのをやめる"
            effects:
              - { param: autonomy, sign: 1, size: M, source: choice, note: "自分で行動を変えた" }
              - { param: autonomy, sign: 1, size: S, source: society, statRef: S06, when: "flags.knowsDateDV == true", note: "授業で学んだ言葉がある" }
              - { param: autonomy, sign: -1, size: S, source: upbringing, statRef: S04, when: "up.witnessedDV == true", note: "支配を見て育った" }
            setFlags: { harutoControl17: stopped }
            next: h-stop
      - id: h-continue
        viewpoint: haruto
        lines:
          - { who: haruto, kind: message, text: "いま、どこ？" }
          - { who: haruto, kind: inner, text: "（不安は少しだけ消えて、また戻ってくる）" }
          - { who: haruto, kind: inner, text: "（この不安のことを、誰かに話したことはない）", face: sad }
        next: END
      - id: h-stop
        viewpoint: haruto
        lines:
          - { who: haruto, kind: message, text: "位置情報の共有、やめよう。ごめん。" }
          - { who: haruto, kind: inner, text: "（不安は消えない。でも、それを相手を縛る理由にはしない）" }
        next: END

  # ───────── ユウ：SNSで画像を求められる ─────────
  - id: E17-YU-SEXTING
    age: 17
    characters: [yu]
    kind: fixed
    domains: [オンラインの性的被害]
    statCard: [S08]
    resources: [violence]
    stage: { place: bedroom, time: night, cast: [{ id: yu, x: 34, pose: phone }] }
    summary: "SNSの相手から、性的な画像を送るように求められた。"
    status: draft
    scenes:
      - id: start
        effects:
          - { param: psychSafety, sign: -1, size: M, source: others, statRef: S08, note: "性的な画像を求められた" }
        lines:
          - { who: narration, text: "好きなバンドの話で、毎晩のように盛り上がっている相手がいる。" }
          - { who: netFriend, kind: message, text: "新曲やばかったね！" }
