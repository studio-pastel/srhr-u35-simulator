# 17歳の章（SPEC.md §10.3）。Claude Code の下書き。すべて status: draft。
#
# 主人公は1人（付録B-43）。who: partner はこの周回のパートナー（16歳で決まる）。
# flags.pregnancyPossible は、属性とパートナーから自動で決まる。
#
# 性交渉の場面（付録B-30）：行為は描かず、会話と暗転で描く。するか・しないかに負の効果を付けない。
# 同意は、決まった言葉の手続きではなく、互いの様子を気にかけ合うこととして描く。
# 性暴力（付録B-43）：性別や性的指向にかかわらず起こり得る前提で、統計の確率で起こす。行為は描かない（P4）。
age: 17
title: "17歳"
season: "高校2年・夏"
status: draft
intro:
  me: "高校2年の夏。進路の話が、少しずつ現実になってきた。"
events:
  # ───────── パートナーがいる場合：するかどうか ─────────
  - id: E17-TALK
    age: 17
    characters: [me]
    kind: fixed
    domains: [同意, 避妊の知識, STIの知識]
    requires: "flags.partnerId == 'sou' || flags.partnerId == 'saki'"
    statCard: [S32, S34]
    stage: { place: bedroom, time: dusk, cast: [{ id: self, x: 28 }, { id: partner, x: 62 }] }
    summary: "付き合い始めた相手と、するかどうかを話した。"
    status: draft
    scenes:
      - id: start
        closeness:
          - { who: sou, delta: 1, note: "付き合い始めた", when: "flags.partnerId == 'sou'" }
          - { who: saki, delta: 1, note: "付き合い始めた", when: "flags.partnerId == 'saki'" }
        lines:
          - { who: narration, text: "付き合って、1か月。今日は、相手の家に来ている。" }
          - { who: partner, text: "今日、親、夜まで帰ってこないんだ。" }
          - { who: self, kind: inner, text: "（……それって、そういうこと？）", face: anxious }
          - { who: narration, text: "映画が終わって、少し静かになった。" }
        choices:
          - id: wait
            label: "相手が何か言うのを、待つ"
            canonical: true
            next: asked
          - id: askFirst
            label: "「……したいなって、思ってて」と自分から言う"
            next: selfAsk
      # ── 相手から聞かれる ──
      - id: asked
        lines:
          - { who: partner, text: "……あのさ。したいなって、思ってて。" }
          - { who: partner, text: "でも、どう思ってるか、聞きたい。" }
          - { who: self, kind: inner, text: "（したいかどうかは、自分で決めていい）" }
          - { who: self, kind: inner, text: "（家でも、自分のからだの感じ方は、そのまま聞いてもらえてきた）", when: "up.bodyRespect == 'respected'" }
          - { who: self, kind: inner, text: "（嫌だって言っても、大げさだと思われるかな）", when: "up.bodyRespect == 'dismissed'", face: anxious }
          - { who: self, kind: inner, text: "（いまそう思っても、あとで気持ちが変わってもいい）", when: "flags.knowsConsent == true" }
          - { who: self, kind: inner, text: "（こういうとき、どうするのが「ふつう」なんだろう）", when: "flags.knowsConsent == false", face: anxious }
        choices:
          - id: notYet
            label: "「まだ、したくない」"
            canonical: true
            neutral: true
            effects:
              - { param: autonomy, sign: 1, size: M, source: choice, note: "気持ちを言えた" }
            next: notYet
          - id: talk
            label: "「うん。でも、その前にちゃんと話したい」"
            neutral: true
            effects:
              - { param: autonomy, sign: 1, size: M, source: choice, note: "話し合おうと言えた" }
              - { param: connection, sign: 1, size: S, source: choice, note: "安心して話せた" }
            next: talk
          - id: silent
            label: "何も言えない"
            effects:
              - { param: autonomy, sign: -1, size: S, source: society, statRef: S06, when: "cond.sexEducation == 'notTaught'", note: "学ぶ機会がなかった" }
            next: silent
      - id: notYet
        effects:
          - { param: connection, sign: 1, size: S, source: others, note: "相手が受けとめた" }
        lines:
          - { who: self, text: "……まだ、したくない。" }
          - { who: partner, text: "わかった。言ってくれて、ありがとう。" }
          - { who: self, kind: inner, text: "（……ちゃんと、聞いてくれた）", face: relieved }
          - { who: narration, text: "そのあとは、お菓子を分けながら、もう1本映画を見た。" }
          - { who: self, kind: inner, text: "（手をつないでるだけで、なんだか、うれしい）", face: smile }
        next: END
      - id: talk
        effects:
          - { param: connection, sign: 1, size: S, source: others, note: "相手が確かめてくれた" }
        lines:
          - { who: self, text: "うん。でも、その前にちゃんと話したい。" }
          - { who: self, text: "避妊のこと、どうしようか。", when: "flags.pregnancyPossible == true" }
          - { who: partner, text: "コンドーム、ある。……実は、使い方も調べた。", when: "flags.pregnancyPossible == true" }
          - { who: self, text: "性感染症のこととか、ちゃんとしたくて。", when: "flags.pregnancyPossible == false" }
          - { who: partner, text: "うん。コンドーム、ある。……実は、調べた。", when: "flags.pregnancyPossible == false" }
          - { who: self, text: "ふふ。……なんか、緊張するね。" }
          - { who: partner, text: "うん。いやだなって思ったら、すぐ言ってね。" }
          - { who: narration, kind: fade, text: "――" }
          - { who: narration, text: "帰り道。夕焼けが、まだ少し残っていた。" }
          - { who: self, kind: inner, text: "（ちょっと緊張したけど、ちゃんと話せてよかった）" }
          - { who: self, kind: inner, text: "（……前より、近くなった気がする）", face: smile }
        next: END
      - id: silent
        effects:
          - { param: connection, sign: 1, size: S, source: others, note: "相手が確かめてくれた" }
        lines:
          - { who: narration, text: "何も言えないまま、時間が過ぎる。" }
          - { who: partner, text: "……迷ってる？" }
          - { who: partner, text: "無理しなくていいよ。今日は、やめとこっか。" }
          - { who: self, kind: inner, text: "（……顔に出てたのかな。ちゃんと見てくれてた）" }
          - { who: self, kind: inner, text: "（次は、自分の言葉で言ってみたい）", face: relieved }
        next: END
      # ── 自分から聞く ──
      - id: selfAsk
        lines:
          - { who: self, text: "……したいなって、思ってて。どう思う？" }
          - { who: partner, text: "……まだ、したくない。", face: anxious }
          - { who: self, kind: inner, text: "（……そっか）" }
        choices:
          - id: accept
            label: "「わかった。言ってくれて、ありがとう」"
            canonical: true
            effects:
              - { param: connection, sign: 1, size: M, source: choice, note: "気持ちを受けとめた" }
            next: accept
          - id: press
            label: "「なんで？　ちょっとだけでも」"
            effects:
              - { param: connection, sign: -1, size: M, source: choice, note: "相手を追いつめた" }
            next: press
      - id: accept
        lines:
          - { who: partner, text: "……ちゃんと聞いてくれて、うれしい。", face: smile }
          - { who: narration, text: "そのあとは、お菓子を分けながら、もう1本映画を見た。" }
          - { who: self, kind: inner, text: "（しなくても、いっしょにいるだけで楽しい）", face: smile }
        next: END
      - id: press
        lines:
          - { who: partner, text: "ごめん。今日は、帰るね。", face: anxious }
          - { who: narration, text: "玄関のドアが閉まる音が、やけに大きく聞こえた。" }
          - { who: self, kind: inner, text: "（……いま、何をしようとしてた？）", face: sad }
        # 押し切ろうとした側にも、学び直す選択肢を置く（付録B-30、§11-4）
        choices:
          - id: apologize
            label: "謝って、話を聞く"
            canonical: true
            effects:
              - { param: autonomy, sign: 1, size: M, source: choice, note: "自分の行動を見直した" }
            next: apologize
          - id: blame
            label: "「はっきりしない相手が悪い」"
            effects:
              - { param: connection, sign: -1, size: S, source: choice, note: "関係がぎくしゃくした" }
            next: blame
      - id: apologize
        lines:
          - { who: self, kind: message, text: "さっきはごめん。嫌って言ってくれたのに、聞かなかった。" }
          - { who: partner, kind: message, text: "……うん。次は、ちゃんと聞いてほしい。" }
          - { who: self, kind: inner, text: "（「いや」は、説得するものじゃない）" }
        next: END
      - id: blame
        lines:
          - { who: self, kind: inner, text: "（……はっきりしないのが悪い）" }
          - { who: narration, text: "その夜、相手からのメッセージは来なかった。" }
          - { who: narration, text: "相手の「いや」を受けとめる方法は、あとからでも学べる。" }
        next: END

  # ───────── 誰にでも：進路（格差の場面。付録B-43） ─────────
  - id: E17-CAREER
    age: 17
    characters: [me]
    kind: fixed
    domains: [ジェンダー格差, 社会経済]
    statCard: [S43, S45]
    stage: { place: classroom, time: dusk, cast: [{ id: self, x: 30 }, { id: tamura, x: 64 }] }
    summary: "進路面談で、先生に思いがけないことを言われた。"
    status: draft
    scenes:
      - id: start
        effects:
          - { param: autonomy, sign: -1, size: S, source: society, statRef: S43, when: "up.gender == 'woman' || up.gender == 'transWoman'", note: "性別で期待が変わる" }
        lines:
          - { who: narration, text: "放課後の進路面談。行きたい学部のことを話した。" }
          - { who: tamura, text: "女の子なんだし、そんなに頑張らなくても、近くの短大でいいんじゃないか。", when: "up.gender == 'woman' || up.gender == 'transWoman'" }
          - { who: tamura, text: "男なら、ちゃんと稼げるところに行かないとな。", when: "up.gender == 'man' || up.gender == 'transMan'" }
          - { who: tamura, text: "願書の性別欄のことは……まあ、そのとき考えよう。", when: "up.gender == 'nonbinary'" }
          - { who: self, kind: inner, text: "（……自分の話を、聞いてくれてない気がする）", face: anxious }
          - { who: self, kind: inner, text: "（それに、うちの家計で、学費はどうするんだろう）", when: "up.economy == 'hardship'" }
        choices:
          - id: say
            label: "「自分で考えて、決めたいです」"
            canonical: true
            effects:
              - { param: autonomy, sign: 1, size: M, source: choice, note: "進路を自分で考えた" }
            next: say
          - id: follow
            label: "「……そうですね」"
            effects:
              - { param: autonomy, sign: -1, size: S, source: choice, note: "言われた進路に寄せた" }
            next: follow
      - id: say
        lines:
          - { who: tamura, text: "……そうか。悪かった。資料、探してみるよ。" }
          - { who: self, kind: inner, text: "（言ってみるものだな）", face: relieved }
        branches:
          - when: "up.economy == 'hardship'"
            next: scholarship
        next: END
      - id: follow
        lines:
          - { who: self, kind: inner, text: "（先生が言うなら、そうなのかな）", face: sad }
        branches:
          - when: "up.economy == 'hardship'"
            next: scholarship
        next: END
      - id: scholarship
        lines:
          - { who: tamura, text: "奨学金や授業料の減免もある。お金のことも、一緒に調べよう。" }
        next: END

  # ───────── 誰にでも：お金（くらし。付録B-43） ─────────
  - id: E17-TRIP
    age: 17
    characters: [me]
    kind: fixed
    domains: [くらし, 社会経済]
    statCard: [S22]
    stage: { place: gate, time: dusk, cast: [{ id: self, x: 30 }, { id: riko, x: 64 }] }
    summary: "友だちに夏の旅行に誘われた。"
    status: draft
    scenes:
      - id: start
        lines:
          - { who: riko, text: "夏休み、みんなで海に行かない？　泊まりで！", face: smile }
        branches:
          - when: "up.economy == 'hardship'"
            next: hard
        next: normal
      - id: normal
        lines:
          - { who: self, kind: inner, text: "（バイト代、ちょっと貯まってるし。どうしよう）" }
        choices:
          - id: go
            label: "「行く！」"
            canonical: true
            effects:
              - { param: connection, sign: 1, size: M, source: choice, note: "友だちと旅行した" }
              - { param: living, sign: -1, size: S, source: choice, note: "バイト代を使った" }
            next: went
          - id: save
            label: "「今回はやめて、貯めておく」"
            effects:
              - { param: living, sign: 1, size: S, source: choice, note: "お金を貯めた" }
            next: saved
      - id: hard
        effects:
          - { param: connection, sign: -1, size: S, source: upbringing, statRef: S22, note: "お金で誘いを断る" }
        lines:
          - { who: self, kind: inner, text: "（交通費と宿代……。家に言い出せる金額じゃない）", face: sad }
        choices:
          - id: decline
            label: "「ごめん、その日、用事があって」"
            canonical: true
            next: declined
          - id: tell
            label: "「実は、お金がなくて」"
            effects:
              - { param: connection, sign: 1, size: M, source: choice, note: "本当のことを話した" }
            next: told
      - id: went
        closeness:
          - { who: riko, delta: 1, note: "いっしょに旅行した" }
        lines:
          - { who: narration, text: "海は、思っていたより冷たくて、思っていたより楽しかった。" }
        next: END
      - id: saved
        lines:
          - { who: self, kind: inner, text: "（写真が回ってくると、ちょっとうらやましい）" }
        next: END
      - id: declined
        lines:
          - { who: riko, text: "そっか、残念。また今度ね。" }
          - { who: self, kind: inner, text: "（「また今度」が、いちばん困る）", face: sad }
        next: END
      - id: told
        closeness:
          - { who: riko, delta: 1, note: "事情を聞いてくれた" }
        lines:
          - { who: riko, text: "そっか。じゃあ、日帰りで近くの海にしない？" }
          - { who: self, kind: inner, text: "（言って、よかった）", face: relieved }
        next: END

  # ───────── 誰にでも：SNSで画像を求められる ─────────
  - id: E17-SNS
    age: 17
    characters: [me]
    kind: fixed
    domains: [オンラインの性的被害]
    statCard: [S08]
    resources: [violence]
    stage: { place: bedroom, time: night, cast: [{ id: self, x: 34, pose: phone }] }
    summary: "SNSの相手から、性的な画像を送るように求められた。"
    status: draft
    scenes:
      - id: start
        effects:
          - { param: connection, sign: -1, size: M, source: others, statRef: S08, note: "性的な画像を求められた" }
        lines:
          - { who: narration, text: "好きなバンドの話で、毎晩のように盛り上がっている相手がいる。" }
          - { who: netFriend, kind: message, text: "新曲やばかったね！" }
          - { who: self, kind: message, text: "わかる、2番のとこ泣いた" }
          - { who: netFriend, kind: message, text: "ねえ、写真送ってよ。顔じゃないやつ。" }
          - { who: self, kind: inner, text: "（……え？）", face: anxious }
        choices:
          - id: refuse
            label: "「それは送らない」"
            canonical: true
            effects:
              - { param: autonomy, sign: 1, size: M, source: choice, note: "自分で断った" }
            next: refuse
          - id: record
            label: "画面を保存して、相談する"
            effects:
              - { param: autonomy, sign: 1, size: M, source: choice, note: "記録して相談した" }
              - { param: connection, sign: 1, size: S, source: choice, note: "一人で抱えなかった" }
            next: record
          - id: send
            label: "送ってしまう"
            next: send
      - id: refuse
        lines:
          - { who: self, kind: message, text: "それは送らない。" }
          - { who: narration, text: "相手からの返信は、それきり来なくなった。" }
          - { who: self, kind: inner, text: "（画面を閉じても、少し手がふるえてる）" }
        next: END
      - id: record
        stage: { place: nurse, time: day, cast: [{ id: self, x: 30 }, { id: mori, x: 64 }] }
        effects:
          - { param: connection, sign: 1, size: S, source: others, note: "保健室で受け止められた" }
        lines:
          - { who: narration, text: "画面を保存して、相手をブロックした。次の日、保健室へ。" }
          - { who: mori, text: "見せてくれてありがとう。あなたは、何も悪くないよ。" }
          - { who: self, kind: inner, text: "（……来て、よかった）", face: relieved }
        next: END
      - id: send
        lines:
          - { who: narration, text: "送ったあと、胸がざわざわして眠れない。" }
          - { who: self, kind: inner, text: "（どうしよう。消してもらえるのかな）", face: sad }
          - { who: narration, text: "送ったあとからでも、相談できる場所がある。" }
        next: END

  # ───────── 誰にでも：自分で選べない出来事（こころ。付録B-43） ─────────
  - id: E17-MIND
    age: 17
    characters: [me]
    kind: chance
    domains: [メンタルヘルス, 選べない出来事]
    statCard: [S54, S57]
    stage: { place: bedroom, time: day, cast: [{ id: self, x: 34 }] }
    summary: "秋になった。朝、起きるのがつらい日があった。"
    status: draft
    scenes:
      - id: start
        lines:
          - { who: narration, text: "夏が終わり、秋になった。" }
        chance:
          id: CH-MIND
          label: "この1年のあいだに、うつ病を経験する確率"
          # S54 の12か月有病率（成人の調査。高校生の値は確認できなかった）を、1年に1回の判定に使う。
          # トランスジェンダー・ノンバイナリーは、全体の値に、S57 の「気分・不安障害にあてはまる可能性」の比（37.5÷13.3）を掛ける（解釈。付録B-46）
          base: { value: 0.021, statRef: S54 }
          modifiers:
            - { when: "up.gender == 'woman'", op: set, value: 0.03, source: society, statRef: S54, note: "女性の割合" }
            - { when: "up.gender == 'man'", op: set, value: 0.01, source: society, statRef: S54, note: "男性の割合" }
            - { when: "up.gender == 'transWoman' || up.gender == 'transMan' || up.gender == 'nonbinary'", op: mul, value: 2.82, source: society, statRef: S57, note: "性別を理由にした困難" }
          outcomes:
            happens:
              effects:
                - { param: body, sign: -1, size: M, note: "うつ病になった" }
                - { param: connection, sign: -1, size: M, note: "何も手につかない" }
              next: happened
            notHappens: { next: fine }
      - id: fine
        lines:
          - { who: self, kind: inner, text: "（今日も、なんとか起きられた）" }
        next: END
      - id: happened
        lines:
          - { who: narration, text: "朝、起き上がれない日が続いた。好きだった音楽も、聞く気がしない。" }
          - { who: self, kind: inner, text: "（なまけてるだけ？　でも、からだが動かない）", face: sad }
          - { who: self, kind: inner, text: "（「気合が足りない」って、また言われるだろうな）", when: "up.bodyRespect == 'dismissed'" }
          - { who: self, kind: inner, text: "（しんどいって、言っていいはずだ）", when: "up.bodyRespect == 'respected'" }
          - { who: narration, text: "誰にでも起こり得ることで、あなたのせいではない。" }
        choices:
          - id: clinic
            label: "保健室で話して、病院につないでもらう"
            canonical: true
            effects:
              - { param: body, sign: 1, size: S, source: choice, note: "受診した" }
              - { param: connection, sign: 1, size: S, source: choice, note: "一人で抱えなかった" }
            next: helped
          - id: alone
            label: "誰にも言わず、やり過ごす"
            next: alone
      - id: helped
        lines:
          - { who: mori, text: "よく来たね。休むことも、治療のうちだよ。" }
          - { who: mori, text: "お家の人にどう話すかも、一緒に考えよう。" }
          - { who: self, kind: inner, text: "（休んでいいって、言ってもらえた）", face: relieved }
        next: END
      - id: alone
        lines:
          - { who: self, kind: inner, text: "（そのうち、よくなるはず）", face: sad }
          - { who: narration, text: "話したくなったときは、いつでも相談できる。" }
        next: END

  # ───────── 誰にでも：性暴力（統計の確率。行為は描かない） ─────────
  - id: E17-HARM
    age: 17
    characters: [me]
    kind: chance
    domains: [性暴力, 選べない出来事]
    statCard: [S33, S02]
    resources: [violence]
    stage: { place: hallway, time: dusk, cast: [{ id: self, x: 34 }] }
    summary: "望まない性的な被害に、あうことがある。"
    status: draft
    scenes:
      - id: start
        lines:
          - { who: narration, text: "冬が近づいてきた。" }
        chance:
          id: CH-HARM
          label: "16〜19歳で、性交を伴う性暴力にあう確率"
          # S33 は性自認で集計している（女性、男性、Xジェンダー・ノンバイナリー）。トランスジェンダーの人は、自認する性別の値を使う（付録B-46）
          base: { value: 0.075, statRef: S33 }
          modifiers:
            - { when: "up.gender == 'woman' || up.gender == 'transWoman'", op: set, value: 0.027, source: society, statRef: S33, note: "女性の割合" }
            - { when: "up.gender == 'man' || up.gender == 'transMan'", op: set, value: 0.005, source: society, statRef: S33, note: "男性の割合" }
          outcomes:
            happens:
              effects:
                - { param: connection, sign: -1, size: L, note: "性暴力の被害" }
                - { param: living, sign: -1, size: L, note: "安心して暮らせなくなった" }
              next: happened
            notHappens: { next: quiet }
      - id: quiet
        lines:
          - { who: narration, text: "何事もなく、季節が過ぎていった。" }
        next: END
      - id: happened
        lines:
          - { who: narration, text: "部活の先輩とのあいだで、望まないことがあった。" }
          - { who: self, kind: inner, text: "（断れなかった。……自分が悪かったのかな）", face: sad }
          - { who: narration, text: "性暴力は、誰にでも起こり得る。あなたのせいではない。" }
        choices:
          - id: tell
            label: "信頼できる人に、話してみる"
            canonical: true
            effects:
              - { param: connection, sign: 1, size: S, source: choice, note: "人に話した" }
            next: told
          - id: notYet
            label: "今は、誰にも話さない"
            next: notYet
      - id: told
        effects:
          - { param: connection, sign: 1, size: S, source: others, note: "話を聞いてもらえた" }
        lines:
          - { who: mori, text: "話してくれて、ありがとう。あなたは、何も悪くない。" }
          - { who: mori, text: "これからのこと、あなたのペースで考えよう。" }
        next: END
      - id: notYet
        lines:
          - { who: self, kind: inner, text: "（今は、まだ言えない）" }
          - { who: narration, text: "話すかどうか、いつ話すかは、自分で決めていい。" }
        next: END
