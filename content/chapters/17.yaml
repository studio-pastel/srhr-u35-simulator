          base: { value: 0.075, statRef: S33 }
          modifiers:
            - { when: "up.gender == 'woman' || up.gender == 'transWoman'", op: set, value: 0.027, source: society, statRef: S33, note: "女性の割合" }
            - { when: "up.gender == 'man' || up.gender == 'transMan'", op: set, value: 0.005, source: society, statRef: S33, note: "男性の割合" }
          outcomes:
            happens:
