            label: "保健室に行って、森先生に話す"
            canonical: true
            effects:
              - { param: body, sign: 1, size: S, source: choice, note: "受診した" }
              - { param: connection, sign: 1, size: S, source: choice, note: "一人で抱えなかった" }
            next: helped
          - id: alone
            label: "誰にも言わず、やり過ごす"
            next: alone
      - id: helped
        stage: { place: nurse, time: day, cast: [{ id: self, x: 30, face: sad }, { id: mori, x: 64 }] }
        lines:
          - { who: self, text: "朝、起きられなくて。何もする気が起きないんです。" }
          - { who: mori, text: "それはつらかったね。一度、病院で相談してみようか。" }
          - { who: mori, text: "お家の人にどう話すかも、一緒に考えよう。" }
          - { who: narration, text: "数日後、病院に行った。「まず休みましょう」と医師は言った。" }
          - { who: self, kind: inner, text: "（休んでいいって、言ってもらえた）", face: relieved }
        next: END
      - id: alone
        lines:
