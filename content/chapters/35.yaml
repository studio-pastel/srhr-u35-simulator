title: "35歳"
season: "春"
status: draft
intro:
  minami: "35歳の春。これからのことを、あらためて考えている。"
  haruto: "35歳の春。子どもは、5歳になった。"
  yu: "35歳の春。アオイと暮らして、11年になる。"
  kei: "35歳の春。弟と妹も、それぞれの道を歩き始めた。"
