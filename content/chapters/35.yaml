    scenes:
      - id: start
        text: "パートナーと、子どもを持つことを考え始めて1年。妊娠しないまま、時間が過ぎた。"
        next: info
      - id: info
        text: "生殖補助医療は、治療を始めるときに40歳未満なら、通算6回まで保険が使えるという。35歳ごろまでは、治療1回あたりで出産に至る割合が約30%前後だ。"
        choices:
          - id: treat
            label: "治療を始める"
            canonical: true
            effects:
              - { param: body, sign: -1, size: S, source: choice, statRef: S31, note: "通院と投薬の負担" }
              - { param: options, sign: -1, size: S, source: society, statRef: S31, note: "仕事との両立が難しい" }
            next: r1
          - id: noTreat
            label: "治療はしない"
            neutral: true
            setFlags: { minamiArtResult: noTreatment }
            next: noTreat
          - id: adopt
            label: "養子・里親制度を調べる"
            neutral: true
            setFlags: { minamiArtResult: adoption }
            next: adopt
      - id: r1
        text: "1回目の治療。注射や採卵のための通院が続く。体調や体力の負担が大きいと感じる人も多い。"
        chance:
          id: CH-ART-1
          label: "この治療で出産に至る確率"
          base: { value: 0.3, statRef: S17 }
