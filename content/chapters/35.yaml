  - id: E35-HARUTO-CYCLE
    age: 35
    characters: [haruto]
    kind: fixed
    domains: [対人暴力の連鎖]
    statCard: [S04]
    status: draft
    scenes:
      - id: start
        text: "かんしゃくを起こした子どもを前に、思わず声が大きくなりかけて、止まる。父の声が、自分の中から聞こえた気がした。"
        next: choose
      - id: choose
        text: "父から受け継いだものを、この子には渡さない。ハルトは、そう決めた。"
        choices:
          - id: talk
            label: "パートナーと話し合う"
            canonical: true
            effects:
              - { param: connection, sign: 1, size: M, source: choice, note: "パートナーと話し合った" }
            next: talked
          - id: seek
            label: "子育ての相談先を探す"
            effects:
              - { param: safety, sign: 1, size: S, source: choice, note: "相談先を探した" }
              - { param: connection, sign: 1, size: S, source: choice, note: "一人で抱えなかった" }
            next: sought
      - id: talked
        text: "その夜、パートナーにすべてを話した。二人で、怒りが出そうなときの約束をつくった。"
        next: END
      - id: sought
        text: "自治体の子育ての相談窓口に電話をかけた。同じように悩む親は、少なくないと知った。"
        next: END

  - id: E35-ALL-REVIEW
