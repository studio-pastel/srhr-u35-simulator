# CH-ART-1〜6（§10.4）：保険適用の上限（40歳未満は通算6回、S18）まで1回ずつ「続ける／やめる」を選ぶ。
# 付録A-22：治療を続けるたびに、からだ −S（選択）と選択肢の幅 −S（社会条件）。根拠は S31。結果には増減を付けない。
