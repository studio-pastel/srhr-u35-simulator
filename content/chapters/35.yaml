# 35歳の章（SPEC.md §10.3）。会話中心の形式（付録B-2）。Claude Code の下書き。すべて status: draft。
#
# 文字数の上限（src/engine/limits.ts）
#   吹き出し lines[].text …… 40字以内（超えると警告）
#   選択肢 label ………………… 30字以内（超えると警告）
#   効果 note ………………………… 20字以内（超えるとエラー。ビルドが止まる）
#   とばしたときの要約 summary … 40字以内（超えると警告）
#
# CH-ART-1〜6（§10.4）：保険適用の上限（40歳未満は通算6回、S18）まで1回ずつ「続ける／やめる」を選ぶ。
# 付録A-22：治療を続けるたびに、からだ −S（選択）と選択肢の幅 −S（社会条件）。根拠は S31。結果には増減を付けない。
age: 35
title: "35歳"
season: "春"
status: draft
intro:
  minami: "35歳の春。これからのことを、あらためて考えている。"
  haruto: "35歳の春。子どもは、5歳になった。"
  yu: "35歳の春。アオイと暮らして、11年になる。"
  kei: "35歳の春。弟と妹も、それぞれの道を歩き始めた。"
