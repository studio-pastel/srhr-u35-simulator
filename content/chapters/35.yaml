# 35歳の章（SPEC.md §10.3）。会話中心の形式（付録B-2）。Claude Code の下書き。すべて status: draft。
#
# 文字数の上限（src/engine/limits.ts）
#   吹き出し lines[].text …… 40字以内（超えると警告）
#   選択肢 label ………………… 30字以内（超えると警告）
#   効果 note ………………………… 20字以内（超えるとエラー。ビルドが止まる）
#   とばしたときの要約 summary … 40字以内（超えると警告）
#
# CH-ART-1〜6（§10.4）：保険適用の上限（40歳未満は通算6回、S18）まで1回ずつ「続ける／やめる」を選ぶ。
# 付録A-22：治療を続けるたびに、からだ −S（選択）と選択肢の幅 −S（社会条件）。根拠は S31。結果には増減を付けない。
age: 35
title: "35歳"
season: "春"
status: draft
intro:
  minami: "35歳の春。これからのことを、あらためて考えている。"
  haruto: "35歳の春。子どもは、5歳になった。"
  yu: "35歳の春。アオイと暮らして、11年になる。"
  kei: "35歳の春。弟と妹も、それぞれの道を歩き始めた。"
events:
  # ───────── ミナミとソウ：不妊治療 ─────────
  - id: E35-MINAMI-ART
    age: 35
    characters: [minami]
    kind: chance
    domains: [不妊]
    requires: "flags.minamiPath == 'later'"
    statCard: [S16, S17, S18, S31]
    resources: [health]
    stage: { place: clinic, time: day, cast: [{ id: minami, x: 30 }, { id: sou, x: 62 }] }
    summary: "ソウと子どもを望み、不妊治療をするかどうか、続けるかどうかを考えた。"
    status: draft
    scenes:
      - id: start
        stage: { place: home2, time: night, cast: [{ id: minami, x: 30 }, { id: sou, x: 62 }] }
        lines:
          - { who: narration, text: "ソウと、子どもを持つことを考え始めて1年。" }
          - { who: minami, kind: inner, text: "（妊娠しないまま、時間が過ぎた）", face: anxious }
          - { who: sou, text: "一度、二人で病院に相談してみない？" }
        next: info
      - id: info
        lines:
          - { who: narration, text: "クリニックで、医師の説明を聞いた。" }
          - { who: narration, text: "生殖補助医療は、治療開始時に40歳未満なら、通算6回まで保険が使える。" }
          - { who: narration, text: "35歳ごろまでは、1回あたりで出産に至る割合は約30%前後だという。" }
          - { who: minami, kind: inner, text: "（仕事との両立、からだの負担……どうしよう）" }
        choices:
          - id: treat
            label: "「治療を、始めてみたい」"
            canonical: true
            effects:
              - { param: body, sign: -1, size: S, source: choice, statRef: S31, note: "通院と投薬の負担" }
              - { param: options, sign: -1, size: S, source: society, statRef: S31, note: "仕事との両立が難しい" }
            next: r1
          - id: noTreat
            label: "「治療は、しないでおこう」"
            neutral: true
            setFlags: { minamiArtResult: noTreatment }
            next: noTreat
          - id: adopt
            label: "「養子や里親のことも、調べたい」"
            neutral: true
            setFlags: { minamiArtResult: adoption }
            next: adopt
      - id: r1
        lines:
          - { who: narration, text: "1回目の治療。注射や採卵のための通院が続く。" }
          - { who: minami, kind: inner, text: "（会議の合間に、病院へ走る）", face: anxious }
        chance:
          id: CH-ART-1
          label: "この治療で出産に至る確率"
          base: { value: 0.3, statRef: S17 }
          outcomes:
            happens: { setFlags: { minamiArtResult: born }, next: born }
            notHappens: { next: afterR1 }
      - id: afterR1
        lines:
          - { who: narration, text: "1回目の治療では、妊娠に至らなかった。" }
          - { who: sou, text: "つらかったね。……次のこと、ゆっくり話そう" }
        choices:
          - id: continue
            label: "「もう一回、続けてみたい」"
            canonical: true
            effects:
              - { param: body, sign: -1, size: S, source: choice, statRef: S31, note: "通院と投薬の負担" }
              - { param: options, sign: -1, size: S, source: society, statRef: S31, note: "仕事との両立が難しい" }
            next: r2
          - id: stop
            label: "「ここで、やめにしたい」"
            setFlags: { minamiArtResult: stopped }
            next: stopped
      - id: r2
        lines:
          - { who: narration, text: "2回目の治療。注射や採卵のための通院が続く。" }
          - { who: minami, kind: inner, text: "（体がだるい。でも、仕事は休めない）", face: sad }
        chance:
