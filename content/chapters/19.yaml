# 19歳の章（SPEC.md §10.3）。Claude Code の下書き。すべて status: draft。
#
# 文字数の上限（src/engine/limits.ts、SPEC.md 付録A-7）
#   シーン本文 text ……… 200字以内（超えると警告）
#   選択肢 label ………… 30字以内（超えると警告）
#   効果 note …………… 20字以内（超えるとエラー。ビルドが止まる）
#
# P7：ミナミの視点のシーンから harutoRoute を書き換えない。
# 暴力による変化は「他者の行為」として、シーンに入ったときの効果で記録する（付録A-14・A-15）。
age: 19
title: "19歳"
season: "春"
status: draft
intro:
  minami: "大学1年の春。ハルトとは、別々の大学に進んでからも付き合っている。"
  haruto: "大学1年の春。ミナミとは、別々の大学に進んでからも付き合っている。"
  yu: "大学1年の春。新しい友人に囲まれて、毎日が少し忙しい。"
  kei: "高校を卒業して、働き始めた。休みの日には、交際しているサキと会う。"
events:
  - id: E19-MH-ESCALATE
    age: 19
    characters: [minami, haruto]
    kind: fixed
    domains: [対人暴力, 避妊]
    triggerWarning: "この章には、交際相手からの暴言や、避妊に協力しないといった性的な強要に触れる場面があります。暴力の行為そのものは描きません。"
    viewpointSwitch:
      from: minami
      to: haruto
      entry: { minami: m-start, haruto: h-start }
    statCard: [S01, S02, S04]
    resources: [violence]
    stage: { place: campus, time: dusk, cast: [{ id: minami }, { id: haruto }] }
    status: draft
    scenes:
      # ── ミナミの視点 ──
      - id: m-start
        viewpoint: minami
        effects:
          - { param: psychSafety, sign: -1, size: L, source: others, statRef: S04, note: "交際相手からの暴言と強要" }
          - { param: safety, sign: -1, size: M, source: others, statRef: S04, note: "避妊に協力してもらえない" }
        text: "予定を断ると、ハルトから強い言葉が返ってくるようになった。避妊をしてほしいと伝えても、聞き入れてもらえなかった。"
        next: m-feel
      - id: m-feel
        viewpoint: minami
        text: "自分が何か間違えたのだろうか、と考えてしまう。でも、ハルトの言葉や行動を決めているのは、ミナミではない。"
        branches:
          - when: "flags.knowsHelplines == true"
            next: m-know
        next: m-choose
      - id: m-know
        viewpoint: minami
        text: "高校の授業で配られたカードを思い出す。相談窓口の番号が並んでいた。"
        next: m-choose
      - id: m-choose
        viewpoint: minami
        text: "ミナミは、スマホを手に取る。"
        choices:
          - id: helpline
            label: "相談窓口に連絡する"
            canonical: true
            effects:
              - { param: connection, sign: 1, size: S, source: choice, note: "相談窓口に連絡した" }
              - { param: safety, sign: 1, size: S, source: society, when: "flags.knowsHelplines == true", note: "授業で相談先を知った" }
            setFlags: { minamiResponse19: helpline }
            next: m-helpline
          - id: friend
            label: "友人に話す"
            effects:
              - { param: connection, sign: 1, size: M, source: choice, note: "友人に話した" }
            setFlags: { minamiResponse19: toldFriend }
            next: m-friend
          - id: notYet
            label: "今は、誰にも話さない"
            setFlags: { minamiResponse19: notYet }
            next: m-notyet
      - id: m-helpline
        viewpoint: minami
        effects:
          - { param: psychSafety, sign: 1, size: M, source: others, note: "相談員が話を聞いた" }
          - { param: safety, sign: 1, size: S, source: others, note: "安全の計画を考えた" }
        text: "電話の向こうの相談員は、最後まで話を聞いてくれた。「あなたのせいではありません」。これからの安全について、一緒に考えることになった。"
        next: END
      - id: m-friend
        viewpoint: minami
        effects:
          - { param: psychSafety, sign: 1, size: S, source: others, note: "友人が受け止めた" }
        text: "友人は「話してくれてよかった」と言って、相談窓口の連絡先を一緒に調べてくれた。"
        next: END
      - id: m-notyet
        viewpoint: minami
        text: "今は、誰にも話さないことにした。話すかどうか、いつ話すかは、ミナミが決めていい。相談窓口の連絡先は、このあと紹介する。"
        next: END

      # ── ハルトの視点 ──
      - id: h-start
        viewpoint: haruto
        effects:
          - { param: autonomy, sign: -1, size: S, source: upbringing, statRef: S04, when: "up.witnessedDV == true", note: "支配を見て育った" }
        text: "ミナミが思いどおりにならないと、強い言葉が出る。避妊の話を出されると、責められている気がして、聞き流した。"
        next: h-think
      - id: h-think
        viewpoint: haruto
        text: "怒鳴っていた父の顔が浮かぶ。自分は父とは違う、と思っていた。"
        branches:
          - when: "flags.knowsDateDV == true"
            next: h-know
        next: h-choose
      - id: h-know
        viewpoint: haruto
        text: "高校の授業で聞いた話がよみがえる。避妊に協力しないことも、暴力になりうる。"
        next: h-choose
      - id: h-choose
        viewpoint: haruto
        text: "ハルトは、どうする？"
        choices:
          - id: reflect
            label: "自分の言動を振り返る"
            effects:
              - { param: autonomy, sign: 1, size: M, source: choice, note: "自分の言動を振り返った" }
            setFlags: { harutoRoute: stopped }
            next: h-reflect
          - id: blame
            label: "相手のせいにする"
            canonical: true
            effects:
              - { param: connection, sign: -1, size: M, source: choice, note: "関係がこじれていく" }
            setFlags: { harutoRoute: continued }
            next: h-blame
      - id: h-reflect
        viewpoint: haruto
        text: "「あれは、父と同じことだった」。言葉にすると、足元が揺れる。それでも、ここで止めると決めた。"
        next: END
      - id: h-blame
        viewpoint: haruto
        text: "「ミナミが悪いんだ」と思うことにした。そう思えば、自分を見なくて済む。"
        next: END

  - id: E19-KS-CONTRACEPTION
    age: 19
    characters: [kei]
    kind: chance
    domains: [避妊, 緊急避妊]
    statCard: [S25, S26, S11]
    resources: [ec]
    stage: { place: bedroom, time: night, cast: [{ id: kei }, { id: saki }] }
    status: draft
    scenes:
      - id: start
        text: "働きながら家族を支える毎日。サキと会える時間は短いけれど、一緒にいると落ち着く。"
        next: trouble
      - id: trouble
        text: "ふたりで過ごす時間が増えた、この1年。"
        chance:
          id: CH-CONTRACEPTION
          label: "この1年に、避妊のトラブルで妊娠に至りうる出来事が起きる確率"
          base: { value: 0.13, statRef: S25 }
          modifiers:
            - { when: "flags.method == 'withdrawal'", op: set, value: 0.2, source: choice, statRef: S25, note: "腟外射精で避妊していた" }
          outcomes:
            happens: { next: notice }
            notHappens: { setFlags: { pregnant: false }, next: noTrouble }
      - id: noTrouble
        text: "この1年、避妊のトラブルは起きなかった。"
        next: END
      - id: notice
        text: "ある夜のこと。"
        branches:
          - when: "flags.method == 'withdrawal' && flags.knowsWithdrawalUnreliable != true"
            next: unaware
          - when: "flags.method == 'withdrawal'"
            next: awareW
        next: awareC
      - id: unaware
        text: "外に出したから大丈夫だと、ケイもサキも思っていた。"
        next: ec
      - id: awareW
        text: "外に出したつもりだった。でも、それが確実な避妊にならないことを、ケイは知っている。"
        next: ecAsk
      - id: awareC
        text: "終わったあとで、コンドームが破れていたことに気づいた。"
        next: ecAsk
      - id: ecAsk
        text: "緊急避妊薬は、性交後72時間以内に飲むのが原則だという。"
        choices:
          - id: use
            label: "緊急避妊薬を入手する"
            canonical: true
            setFlags: { usedEC: true }
            next: getEC
          - id: wait
            label: "様子を見る"
            setFlags: { usedEC: false }
            next: ec
      - id: getEC
        text: "サキと二人で、どこで手に入るかを調べた。"
        branches:
          - when: "cond.ecAccess == 'prescriptionOnly'"
            next: clinic
        next: pharmacy
      - id: clinic
        effects:
          - { param: options, sign: -1, size: S, source: society, statRef: S11, note: "受診しないと買えない" }
        text: "この頃は、受診して処方を受けないと買えなかった。仕事を抜けて、二人で病院を探した。"
        next: costCheck
      - id: pharmacy
        text: "近くの薬局で、薬剤師に相談した。処方箋はいらず、サキは薬剤師の前で薬を飲んだ。"
        next: costCheck
      - id: costCheck
        text: "薬を受け取って、店を出た。"
        branches:
          - when: "up.economy == 'hardship'"
            next: cost
        next: ec
      - id: cost
        effects:
          - { param: options, sign: -1, size: S, source: upbringing, statRef: S11, note: "薬代7,480円の負担" }
        text: "薬の値段は7,480円だった。今月の家計を思い浮かべると、小さくない金額だ。二人で出し合って払った。"
        next: ec
      - id: ec
        text: "あとは、結果を待つしかない。"
        chance:
          id: CH-EC
          label: "妊娠が成立する確率"
          base: { value: 1.0, statRef: S25 }
          modifiers:
            - { when: "flags.usedEC == true", op: mul, value: 0.16, source: choice, statRef: S26, note: "緊急避妊薬を使った" }
          outcomes:
            happens: { setFlags: { pregnant: true }, next: pregnant }
            notHappens: { setFlags: { pregnant: false }, next: notPregnant }
      - id: pregnant
        text: "しばらくして、サキから連絡が来た。「妊娠しているみたい」。"
        next: END
      - id: notPregnant
        text: "しばらくして、月経が来たとサキから連絡があった。二人で、これからの避妊について話した。"
        next: END

  - id: E19-YU-COMINGOUT
    age: 19
    characters: [yu]
    kind: fixed
    domains: [性の多様性, 人権]
    statCard: [S24]
    stage: { place: campus, time: day, cast: [{ id: yu }] }
    status: draft
    scenes:
      - id: start
        effects:
          - { param: psychSafety, sign: -1, size: S, source: upbringing, when: "up.comingOutAnxiety == true", note: "話した後の反応が不安" }
        text: "大学で、よく話す友人ができた。恋愛の話になると、ユウは少しだけ黙ってしまう。"
        next: word
      - id: word
        # §11-6：自認の言葉は、本人が選ぶ場面を経てから使う。どれを選んでも正解・不正解はない
        text: "自分のことを、どんな言葉で表すか。考える時間は、これまでにもたくさんあった。"
        choices:
          - id: lesbian
            label: "「レズビアン」がしっくりくる"
            neutral: true
            effects:
              - { param: autonomy, sign: 1, size: S, source: choice, note: "自分の言葉を選んだ" }
            setFlags: { yuWord: lesbian }
            next: tell
          - id: bi
            label: "「バイセクシュアル」がしっくりくる"
            neutral: true
            effects:
              - { param: autonomy, sign: 1, size: S, source: choice, note: "自分の言葉を選んだ" }
            setFlags: { yuWord: bisexual }
            next: tell
          - id: none
            label: "今は、言葉を決めない"
            neutral: true
            canonical: true
            effects:
              - { param: autonomy, sign: 1, size: S, source: choice, note: "決めない自由を選んだ" }
            setFlags: { yuWord: none }
            next: tell
      - id: tell
        text: "友人に、自分のことを話すかどうか。"
        choices:
          - id: talk
            label: "話す"
            neutral: true
            effects:
              - { param: connection, sign: 1, size: M, source: choice, note: "友人に話した" }
            setFlags: { yuOut19: true }
            next: talked
          - id: notYet
            label: "まだ話さない"
            neutral: true
            canonical: true
            effects:
              - { param: autonomy, sign: 1, size: S, source: choice, note: "話す時を自分で選ぶ" }
            setFlags: { yuOut19: false }
            next: notTalked
      - id: talked
        effects:
          - { param: psychSafety, sign: 1, size: S, source: others, note: "友人が受け止めた" }
        text: "友人は少し驚いてから、「教えてくれてありがとう」と言った。それだけで、肩の力が抜けた。"
        next: END
      - id: notTalked
        text: "今は、まだ話さないと決めた。話すかどうか、いつ話すかは、ユウが決めていい。"
        next: END
