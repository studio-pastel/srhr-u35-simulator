# 16歳の章（SPEC.md §10.3）。Claude Code の下書き。すべて status: draft。
#
# 主人公は1人（付録B-43）。who: self は主人公、who: partner はこの周回のパートナー。
# up.gender／up.body／up.attractedTo／up.economy などの属性で、出来事と吹き出し（lines[].when）を出し分ける。
#
# 書き方の決まり（付録B-48）
#   - 選択肢の直前の行は、問いかけか、はっきりした状況にする。選択肢はその答えになっていること
#   - 「」は口に出す言葉（聞き手が場にいること）、（）は心の声、記号なしは行動
#   - 選んだ言葉を、次の行でくり返さない
#   - 話す人は、その場面の舞台にいること（メッセージを除く）
#   - 心の声に教訓を書かない。大人に定型のお礼を言わせない
#
# 文字数の上限（src/engine/limits.ts）
#   吹き出し 40字／選択肢 30字／効果 note 20字（超えるとエラー）／要約 40字
age: 16
title: "16歳"
season: "高校1年・秋"
status: draft
intro:
  me: "高校1年の秋。クラスにも、ようやく慣れてきた。"
events:
  # ───────── 誰にでも：気になる人のこと ─────────
  - id: E16-CRUSH
    age: 16
    characters: [me]
    kind: fixed
    trigger: { kind: story, text: "誰にでも起きる" }
    domains: [関係性, 性の多様性]
    stage: { place: classroom, time: day, cast: [{ id: self, x: 30 }, { id: riko, x: 64 }] }
    summary: "昼休み、友だちと恋愛の話になった。"
    status: draft
    scenes:
      - id: start
        lines:
          - { who: narration, text: "昼休み。友だちのルイが、身を乗り出してきた。" }
          - { who: riko, text: "で、好きな人とかいないの？　こっちは全部話したのに。" }
          - { who: self, kind: inner, text: "（クラスのソウとは、最近よく話す。話してると楽しい）", when: "up.attractedTo == 'men'" }
          - { who: self, kind: inner, text: "（クラスのサキとは、最近よく話す。話してると楽しい）", when: "up.attractedTo == 'women'" }
          - { who: self, kind: inner, text: "（ソウとも、サキとも、話してると楽しい。どっちが、とかじゃなく）", when: "up.attractedTo == 'any'" }
          - { who: self, kind: inner, text: "（みんなが言う「好き」が、自分にはよくわからない）", when: "up.attractedTo == 'none'" }
          - { who: self, kind: inner, text: "（好きって、どういう気持ちなんだろう）", when: "up.attractedTo == 'unsure'" }
        choices:
          - id: sou
            label: "「実は、ソウのことが気になってて」"
            requires: "up.attractedTo == 'men' || up.attractedTo == 'any'"
            canonical: true
            effects:
              - { param: connection, sign: 1, size: S, source: choice, note: "気持ちを話せた" }
            setFlags: { partnerId: sou }
            next: told
          - id: saki
            label: "「実は、サキのことが気になってて」"
            requires: "up.attractedTo == 'women' || up.attractedTo == 'any'"
            canonical: true
            effects:
              - { param: connection, sign: 1, size: S, source: choice, note: "気持ちを話せた" }
            setFlags: { partnerId: saki }
            next: told
          # 言わなくても、気持ちがなくなるわけではない。だから、秘密にしてもパートナーの話は続く
          - id: dodgeSou
            label: "「えー、秘密」"
            requires: "up.attractedTo == 'men'"
            setFlags: { partnerId: sou }
            next: dodge
          - id: dodgeSaki
            label: "「えー、秘密」"
            requires: "up.attractedTo == 'women'"
            setFlags: { partnerId: saki }
            next: dodge
          - id: dodgeAny
            label: "「えー、秘密」"
            requires: "up.attractedTo == 'any'"
            next: dodgeWho
          - id: dodge
            label: "「えー、秘密」"
            requires: "up.attractedTo == 'none' || up.attractedTo == 'unsure'"
            next: dodge
          - id: honest
            label: "「そういうの、あんまりピンとこなくて」"
            requires: "up.attractedTo == 'none' || up.attractedTo == 'unsure'"
            canonical: true
            effects:
              - { param: autonomy, sign: 1, size: S, source: choice, note: "自分の感じ方を言えた" }
            next: honest
      - id: told
        closeness:
          - { who: riko, delta: 1, note: "話を聞いてくれた" }
        lines:
          - { who: riko, text: "えっ、%partner%？　いいじゃん。今度くわしく聞かせて。", face: smile }
          - { who: riko, text: "大丈夫、誰にも言わないから。" }
          - { who: self, kind: inner, text: "（言っちゃった。でも、ルイの顔は変わらなかった）", face: relieved }
        next: END
      - id: dodge
        lines:
          - { who: riko, text: "えー、ずるい。まあいいけど。" }
          - { who: self, kind: inner, text: "（……言わなくても、いいよね）" }
        next: END
      - id: dodgeWho
        lines:
          - { who: riko, text: "えー、ずるい。まあいいけど。" }
          - { who: self, kind: inner, text: "（……ほんとは、最近よく考えてしまう人がいる）" }
        choices:
          - id: thinkSou
            label: "（ソウのこと）"
            canonical: true
            setFlags: { partnerId: sou }
            next: END
          - id: thinkSaki
            label: "（サキのこと）"
            setFlags: { partnerId: saki }
            next: END
      - id: honest
        closeness:
          - { who: riko, delta: 1, note: "否定しないでくれた" }
        lines:
          - { who: riko, text: "あー、そういう人もいるよね。" }
          - { who: riko, text: "じゃあ、購買の新しいパンの話しよ。", face: smile }
          - { who: self, kind: inner, text: "（なんだ、そんな感じでいいのか）", face: relieved }
        next: END

  # ───────── トランスジェンダー・ノンバイナリー：制服 ─────────
  - id: E16-UNIFORM
    age: 16
    characters: [me]
    kind: fixed
    trigger: { kind: profile, text: "性自認から起きた" }
    domains: [性の多様性, 学校]
    requires: "up.gender == 'transWoman' || up.gender == 'transMan' || up.gender == 'nonbinary'"
    statCard: [S24]
    stage: { place: hallway, time: day, cast: [{ id: self, x: 34, face: anxious }] }
    summary: "制服や更衣室のことで、毎日少し疲れている。"
    status: draft
    scenes:
      - id: start
        lines:
          - { who: narration, text: "体育の前。更衣室の入り口で、足が止まる。" }
          - { who: self, kind: inner, text: "（どっちに入っても、落ち着かない）", face: anxious }
          - { who: self, kind: inner, text: "（制服も、名簿の呼ばれ方も、毎日少しずつ疲れる）" }
          - { who: self, kind: inner, text: "（今日は、どうしよう）" }
        choices:
          - id: nurse
            label: "保健室に行って、森先生に話してみる"
            canonical: true
            effects:
              - { param: autonomy, sign: 1, size: M, source: choice, note: "困りごとを相談した" }
            next: nurse
          - id: endure
            label: "今日も、そのまま更衣室に入る"
            next: endure
      - id: nurse
        stage: { place: nurse, time: day, cast: [{ id: self, x: 30 }, { id: mori, x: 64 }] }
        effects:
          - { param: connection, sign: 1, size: S, source: others, note: "先生が受け止めた" }
        lines:
          - { who: self, text: "あの、体育の着替えのことなんですけど……。" }
          - { who: mori, text: "うん。どんなときが、いちばんしんどい？" }
          - { who: self, text: "どっちの更衣室に入っても、落ち着かなくて。" }
          - { who: mori, text: "そっか。ここで着替えることもできるよ。" }
          - { who: mori, text: "制服や呼ばれ方のことも、どうしたいか聞かせて。" }
          - { who: self, kind: inner, text: "（「どうしたいか」って、初めて聞かれた）", face: relieved }
        next: END
      - id: endure
        lines:
          - { who: self, kind: inner, text: "（騒ぎにしたくない）" }
          - { who: self, kind: inner, text: "（言うとしても、いまじゃない）" }
        next: END

  # ───────── からだの心配（妊娠の可能性がない場合） ─────────
  - id: E16-BODYWORRY
    age: 16
    characters: [me]
    kind: fixed
    trigger: { kind: profile, text: "からだの条件から起きた" }
    domains: [からだ, 性の知識]
    requires: "up.body == 'cannot'"
    stage: { place: bedroom, time: night, cast: [{ id: self, x: 34, pose: phone }] }
    summary: "からだのことをネットで調べて、不安になった。"
    status: draft
    scenes:
      - id: start
        lines:
          - { who: narration, text: "夜、スマホを見ていたら、からだの悩みの広告が出てきた。" }
          - { who: self, kind: inner, text: "（「高校生のうちに対策しないと手遅れ」って……ほんと？）", face: anxious }
          - { who: self, kind: inner, text: "（友だちにも親にも、こんなこと聞けない）" }
        choices:
          - id: official
            label: "広告じゃないページで、調べ直す"
            canonical: true
            effects:
              - { param: body, sign: 1, size: S, source: choice, note: "正しい情報を探した" }
            next: official
          - id: buy
            label: "とりあえず、広告の商品を買ってみる"
            effects:
              - { param: living, sign: -1, size: S, source: choice, note: "お小遣いを使った" }
            next: buy
      - id: official
        lines:
          - { who: narration, text: "病院や公的機関のページを、いくつか読んだ。" }
          - { who: self, kind: inner, text: "（なんだ、心配しなくていいことも多いんだ）", face: relieved }
        next: END
      - id: buy
        lines:
          - { who: narration, text: "届いたのは、よくわからないサプリだった。" }
          - { who: self, kind: inner, text: "（……なんか、損した気がする）", face: sad }
        next: END

  - id: E16-HPV
    age: 16
    characters: [me]
    requires: "up.body == 'canBePregnant'"
    kind: fixed
    trigger: { kind: profile, text: "からだの条件から起きた" }
    domains: [ワクチンで防げる疾患]
    statCard: [S13, S28]
    stage: { place: living, time: day, cast: [{ id: self, x: 30 }, { id: yuMother, x: 64 }] }
    summary: "HPVワクチンを受けるかどうかを考えた。"
    status: draft
    scenes:
      - id: start
        lines:
          - { who: narration, text: "テーブルの上に、HPVワクチンの案内が置いてある。" }
          - { who: yuMother, text: "これ、無料で受けられるのは今年度で最後なんだって。" }
          - { who: yuMother, text: "お母さんもよくわからなくて。あなたは、どうしたい？" }
        choices:
          - id: research
            label: "「自分で調べてから決める」"
            canonical: true
            effects:
              - { param: autonomy, sign: 1, size: M, source: choice, note: "自分で調べて決めた" }
            next: research
          - id: parent
            label: "「お母さんが決めていいよ」"
            setFlags: { yuHpv: leftToParent }
            next: parent
          - id: decline
            label: "「今は、受けない」"
            setFlags: { yuHpv: declined }
            next: decline
      - id: research
        stage: { place: bedroom, time: night, cast: [{ id: self, x: 34, pose: phone }] }
        lines:
          - { who: narration, text: "その夜、厚生労働省や自治体の資料を読み比べた。" }
          - { who: self, kind: inner, text: "（性的な経験がある女性の、半分以上が一度はかかるんだ……）" }
          - { who: self, kind: inner, text: "（「女性の」と書いてある。でも、子宮があるのは自分も同じだ）", when: "up.gender != 'woman'" }
          - { who: self, kind: inner, text: "（ワクチンで、子宮頸がんの原因の50〜70%を防げるって書いてある）" }
        next: decide
      - id: decide
        stage: { place: living, time: day, cast: [{ id: self, x: 30 }, { id: yuMother, x: 64 }] }
        lines:
          - { who: narration, text: "わからないところは、近くの医院にも聞いてみた。数日後。" }
          - { who: yuMother, text: "調べてみて、どうだった？" }
        choices:
          - id: receive
            label: "「受けようと思う」"
            canonical: true
            effects:
              - { param: body, sign: 1, size: S, source: choice, statRef: S28, note: "HPVワクチンを受けた" }
            setFlags: { yuHpv: vaccinated }
            next: received
          - id: notNow
            label: "「今は、受けないでおく」"
            setFlags: { yuHpv: notNow }
            next: notNow
      - id: received
        lines:
          - { who: yuMother, text: "わかった。じゃあ、予約しようか。" }
          - { who: self, kind: inner, text: "（自分で決めるって、案外、時間がかかるんだな）", face: smile }
        next: END
      - id: notNow
        lines:
          - { who: yuMother, text: "そう。案内は、とっておくね。" }
          - { who: self, kind: inner, text: "（いまはこれでいい。理由は、自分の中にある）" }
        next: END
      - id: parent
        effects:
          - { param: body, sign: 1, size: S, source: others, statRef: S28, note: "母が接種を決めた" }
        lines:
          - { who: yuMother, text: "わかった。お医者さんに聞いてみるね。" }
          - { who: narration, text: "母は医療機関で相談して、受けることに決めた。" }
        next: END
      - id: decline
        lines:
          - { who: yuMother, text: "そう。案内は、とっておくね。" }
          - { who: self, kind: inner, text: "（いつか気になったら、そのとき考えよう）" }
        next: END

  - id: E16-DIET
    age: 16
    characters: [me]
    requires: "up.body == 'canBePregnant'"
    kind: fixed
    trigger: { kind: profile, text: "からだの条件から起きた" }
    domains: [栄養, 月経]
    statCard: [S14]
    stage: { place: classroom, time: day, cast: [{ id: self, x: 30 }, { id: riko, x: 64 }] }
    summary: "ダイエットで月経が止まり、どうするかを考えた。"
    status: draft
    scenes:
      - id: lunch
        lines:
          - { who: narration, text: "昼休み。" }
          - { who: riko, text: "今日もお昼サラダだけ？" }
          - { who: self, text: "うん。もうちょっと頑張りたくて。" }
          - { who: riko, text: "そっか……。無理しないでね。" }
        next: start
      - id: start
        stage: { place: bedroom, time: night, cast: [{ id: self, x: 34 }] }
        lines:
          - { who: narration, text: "その夜、自分の部屋。" }
          - { who: self, kind: inner, text: "（ダイエットを始めて、もう二か月）" }
          - { who: self, kind: inner, text: "（体重は減った。でも……先月から、月経が来てない）", face: anxious }
        next: noTalk
      - id: noTalk
        stage: { place: bedroom, time: night, cast: [{ id: self, x: 34, face: anxious }] }
        lines:
          - { who: narration, text: "台所から、母の声が聞こえる。" }
          - { who: self, kind: inner, text: "（お母さんに言っても、「みんな我慢してる」って言われそう）", when: "up.bodyRespect == 'dismissed'" }
          - { who: self, kind: inner, text: "（お母さんに言ったら、全部お母さんが決めてしまいそう）", when: "up.bodyRespect == 'managed'" }
          - { who: self, kind: inner, text: "（お母さんなら聞いてくれると思う。でも、言うかは自分で決めたい）", when: "up.bodyRespect == 'respected'" }
        next: choose
      - id: choose
        stage: { place: bedroom, time: night, cast: [{ id: self, x: 34, face: anxious }] }
        lines:
          - { who: self, kind: inner, text: "（どうしよう）" }
        choices:
          - id: nurse
            label: "（明日、保健室で聞いてみよう）"
            canonical: true
            effects:
              - { param: body, sign: 1, size: M, source: choice, note: "保健室で相談した" }
              - { param: connection, sign: 1, size: S, source: choice, note: "話を聞いてもらえた" }
              - { param: connection, sign: 1, size: S, source: society, when: "flags.knowsHelplines == true", note: "授業で相談先を知った" }
            next: nurse
          - id: clinic
            label: "（婦人科を、自分で予約してみよう）"
            next: insurance
          - id: keepOn
            label: "（もう少しだけ、食事を減らそう）"
            # 付録A-21：ダイエット全般ではなく「極端な食事制限」だけを、30歳の CH-LBW の補正の条件にする
            setFlags: { extremeDiet: true }
            effects:
              - { param: body, sign: -1, size: M, source: choice, note: "食事を減らし続けた" }
              - { param: body, sign: -1, size: S, source: upbringing, when: "up.bodyRespect == 'dismissed'", note: "しんどさを我慢するのに慣れてきた" }
            next: keepOn
      - id: nurse
        stage: { place: nurse, time: day, cast: [{ id: self, x: 30 }, { id: mori, x: 64 }] }
        effects:
          - { param: connection, sign: 1, size: S, source: others, note: "養護教諭が受け止めた" }
        lines:
          - { who: self, text: "あの……先月から、月経が来なくて。" }
          - { who: mori, text: "そっか。ごはんは、ちゃんと食べられてる？" }
          - { who: self, text: "……あんまり。ダイエットしてて。" }
          - { who: mori, text: "一度、婦人科でみてもらおうか。探し方、一緒に調べよう。" }
          - { who: mori, text: "保険証のことや、お家にどう話すかも、一緒に考えよう。" }
          - { who: self, kind: inner, text: "（責められなかった）", face: relieved }
        next: END
      # 保険証を使うと、受診先が親に伝わることがある（付録B-45）。協会けんぽの「医療費のお知らせ」は、扶養家族の分も医療機関名とともに記載される
      - id: insurance
        stage: { place: bedroom, time: night, cast: [{ id: self, x: 34, pose: phone, face: anxious }] }
        lines:
          - { who: narration, text: "予約のページを開いて、指が止まった。" }
          - { who: self, kind: inner, text: "（保険証、お母さんが持ってる。借りたら理由を聞かれる）" }
          - { who: self, kind: inner, text: "（あとから届く医療費のお知らせに、病院の名前が載るかも）" }
          - { who: self, kind: inner, text: "（保険を使わないと、全額自分で払うことになる）" }
          - { who: self, kind: inner, text: "（うちに、そんなお金はない）", when: "up.economy == 'hardship'" }
        choices:
          - id: tellParent
            label: "お母さんに話して、保険証を借りる"
            canonical: true
            effects:
              - { param: body, sign: 1, size: M, source: choice, note: "婦人科を受診した" }
              - { param: autonomy, sign: 1, size: S, source: choice, note: "自分で話して受診した" }
            next: tellParent
          - id: selfPay
            label: "貯めたお小遣いで、保険を使わずに受診する"
            requires: "up.economy == 'middle'"
            effects:
              - { param: body, sign: 1, size: M, source: choice, note: "婦人科を受診した" }
              - { param: living, sign: -1, size: M, source: choice, note: "全額を自分で払った" }
            setFlags: { selfPaid: true }
            next: selfPay
          - id: giveUp
            label: "親に知られるくらいなら、行かない"
            next: giveUp
      - id: tellParent
        stage: { place: living, time: night, cast: [{ id: self, x: 30, face: anxious }, { id: yuMother, x: 64 }] }
        effects:
          - { param: connection, sign: 1, size: S, source: upbringing, when: "up.bodyRespect == 'respected'", note: "不調を受けとめてもらえる家だった" }
          - { param: autonomy, sign: -1, size: S, source: upbringing, when: "up.bodyRespect == 'managed'", note: "受診先も親が決めた" }
          - { param: connection, sign: -1, size: S, source: upbringing, when: "up.bodyRespect == 'dismissed'", note: "しんどさを軽く扱われた" }
        lines:
          - { who: self, text: "あの……月経が来なくて。婦人科に行きたい。" }
          - { who: yuMother, text: "そう。言ってくれてよかった。保険証、渡すね。", when: "up.bodyRespect == 'respected'" }
          - { who: yuMother, text: "わかった。病院はお母さんが探して、予約しておくから。", when: "up.bodyRespect == 'managed'" }
          - { who: yuMother, text: "みんな、そんなものよ。……行きたいなら、保険証は渡すけど。", when: "up.bodyRespect == 'dismissed'" }
          - { who: self, kind: inner, text: "（言えた。心臓が、まだどきどきしてる）" }
        next: clinic
      - id: selfPay
        lines:
          - { who: self, kind: inner, text: "（受付で「保険証は使いません」って言えばいいのかな）", face: anxious }
          - { who: self, kind: inner, text: "（お小遣い、これでだいぶ減っちゃうな）" }
        next: clinic
      - id: giveUp
        effects:
          - { param: body, sign: -1, size: S, source: society, note: "親に知られずに受診しにくい" }
        lines:
          - { who: self, kind: inner, text: "（自分のからだのことなのに、親に知られずに行くのは難しい）", face: sad }
        next: END
      - id: clinic
        stage: { place: clinic, time: day, cast: [{ id: self, x: 34 }] }
        lines:
          - { who: narration, text: "数日後、婦人科の待合室。" }
