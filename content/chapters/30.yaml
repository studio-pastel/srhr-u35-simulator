# 30歳の章（SPEC.md §10.3）。会話中心の形式（付録B-2）。Claude Code の下書き。すべて status: draft。
#
# 文字数の上限（src/engine/limits.ts）
#   吹き出し lines[].text …… 40字以内（超えると警告）
#   選択肢 label ………………… 30字以内（超えると警告）
#   効果 note ………………………… 20字以内（超えるとエラー。ビルドが止まる）
#   とばしたときの要約 summary … 40字以内（超えると警告）
#
# P1：出産をプラスの結末として扱わない。出産そのものではパラメーターを動かさない（付録A-21）。
# §10.4：低出生体重を母親の責任として描かない。
# 付録B-33：ケイが吸い続けている場合（keiSmokes）は、子どものそばでの喫煙を扱う（S42）。
age: 30
title: "30歳"
season: "秋"
status: draft
intro:
  minami: "30歳の秋。仕事にも、少し余裕が出てきた。"
  haruto: "30歳の秋。ナオとのあいだに、子どもが生まれた。"
  yu: "30歳の秋。アオイとの暮らしは、6年目になった。"
  kei: "30歳の秋。家族の形は、10代のころに思っていたものと少し違う。"
events:
  # ───────── ハルト：育児休業 ─────────
  - id: E30-HARUTO-LEAVE
    age: 30
    characters: [haruto]
    kind: fixed
    domains: [両立, ジェンダー規範]
    statCard: [S21, S20]
    stage: { place: living, time: day, cast: [{ id: haruto, x: 26 }, { id: nao, x: 54 }, { id: haruChild, x: 62 }] }
    summary: "子どもが生まれ、育児休業を取るかどうかを決めた。"
    status: draft
    scenes:
      - id: start
        lines:
          - { who: narration, text: "子どもが生まれた。小さな手が、指をにぎる。" }
          - { who: nao, text: "育休、どうする？　会社に制度はあるんだよね。" }
        branches:
          - when: "cond.parentalLeave == 'hard'"
            next: hard
        next: choose
      - id: hard
        lines:
          - { who: haruto, kind: inner, text: "（職場で、男性で育休を取った人は、まだいない）", face: anxious }
          - { who: haruto, kind: inner, text: "（上司の顔が浮かぶ）" }
        next: choose
      - id: choose
        lines:
          - { who: haruto, kind: inner, text: "（……どうする？）" }
        choices:
          - id: take
            label: "「取るよ。二人で育てたい」"
            canonical: true
            effects:
              - { param: connection, sign: 1, size: M, source: choice, note: "育児休業を取った" }
              - { param: options, sign: -1, size: S, source: society, statRef: S21, when: "cond.parentalLeave == 'hard'", note: "取りにくい職場" }
            closeness:
              - { who: haruChild, delta: 1, note: "育児休業を取った" }
              - { who: nao, delta: 1, note: "二人で育てている" }
            next: took
          - id: skip
            label: "「今は、仕事を休めない」"
            effects:
              - { param: connection, sign: -1, size: S, source: choice, note: "育児の時間が少ない" }
            closeness:
              - { who: nao, delta: -1, note: "育児を任せきりにした" }
            next: skipped
      - id: took
        lines:
          - { who: haruto, text: "取るよ。二人で育てたい。" }
          - { who: narration, text: "夜中のミルクも、おむつ替えも、二人で交代する。" }
          - { who: nao, text: "寝不足だけど、二人だと笑えるね。", face: smile }
        next: END
      - id: skipped
        lines:
          - { who: haruto, text: "今は、仕事を休めない。" }
          - { who: narration, text: "帰宅すると、子どもはもう眠っている。" }
          - { who: nao, text: "……今日も、一人で大変だった。", face: sad }
        next: END

  # ───────── ミナミ：妊娠と出産、または仕事の転機 ─────────
  - id: E30-MINAMI-BRANCH
    age: 30
    characters: [minami]
    kind: chance
    domains: [栄養, 妊娠]
    statCard: [S14, S15, S30]
    resources: [health]
    stage: { place: home2, time: day, cast: [{ id: minami, x: 30 }, { id: sou, x: 62 }] }
    summary: "30歳になり、妊娠と出産、または仕事の転機を迎えた。"
    status: draft
    scenes:
      - id: start
        lines:
          - { who: narration, text: "30歳になった。" }
        branches:
          - when: "flags.minamiPath == 'now'"
            next: now
        next: career
      # ── 27歳で子どものことを話した場合：妊娠・出産 ──
      - id: now
        lines:
          - { who: narration, text: "妊娠がわかった。体調の変化に戸惑いながら、健診に通う。" }
          - { who: sou, text: "次の健診、おれも休みを取っていっしょに行くよ。" }
        branches:
          - when: "flags.minamiExtremeDiet == true"
            next: thin
          - when: "flags.minamiFolate == true"
            next: folate
        next: birth
      - id: folate
        lines:
          - { who: minami, kind: inner, text: "（27歳のときから、葉酸は続けてきた）" }
        next: birth
      - id: thin
        lines:
          - { who: narration, text: "16歳のころからの極端な食事制限のあと、妊娠前も、やせた状態が続いていた。" }
          - { who: narration, text: "からだのことを相談できる場は、これまで多くはなかった。" }
        next: birth
      - id: birth
        lines:
          - { who: narration, text: "出産の日が来た。" }
        chance:
          id: CH-LBW
          label: "出生体重が2,500g未満になる確率"
          base: { value: 0.098, statRef: S15 }
          modifiers:
            # 付録A-21：基本の確率9.8%（S15）のオッズに、オッズ比1.61（S30）を掛けて換算した値（解釈）
            - { when: "flags.minamiExtremeDiet == true", op: set, value: 0.149, source: choice, statRef: S30, note: "妊娠前の極端なやせ" }
          outcomes:
            happens: { setFlags: { minamiLbw: true }, next: lbw }
            notHappens: { setFlags: { minamiLbw: false }, next: born }
      - id: lbw
        closeness:
          - { who: sou, delta: 1, note: "そばにいてくれた" }
        stage: { place: clinic, time: day, cast: [{ id: minami, x: 30 }, { id: sou, x: 62 }] }
        lines:
          - { who: narration, text: "生まれた子どもの体重は、2,500gに届かなかった。" }
          - { who: narration, text: "医療スタッフに見守られながら、少しずつ育っていく。" }
          - { who: sou, text: "ミナミのせいじゃないよ。いっしょに見ていこう。" }
          - { who: narration, text: "出生体重は、母親一人の責任で決まるものではない。" }
        next: END
      - id: born
        closeness:
          - { who: sou, delta: 1, note: "いっしょに育てている" }
        lines:
          - { who: narration, text: "子どもが生まれた。慣れない毎日が始まる。" }
          - { who: sou, text: "交代で寝よう。おれ、夜の担当するから。" }
        next: END
      # ── 子どもを持たない・まだ決めない場合：仕事の転機 ──
      - id: career
        stage: { place: office, time: day, cast: [{ id: minami, x: 30 }, { id: coworker, x: 62 }] }
        lines:
          - { who: narration, text: "上司から、新しい部署への異動を打診された。" }
          - { who: coworker, text: "ミナミなら、新しいところでもやれると思うよ。" }
        choices:
          - id: move
            label: "「受けてみます」"
            neutral: true
            canonical: true
            effects:
              - { param: options, sign: 1, size: M, source: choice, note: "新しい仕事に挑んだ" }
            next: moved
          - id: stay
            label: "「今の部署で、もっと深めたいです」"
            neutral: true
            effects:
              - { param: autonomy, sign: 1, size: S, source: choice, note: "働き方を自分で選んだ" }
            next: stayed
      - id: moved
        lines:
          - { who: minami, kind: inner, text: "（一から覚えることばかり。忙しいけど、毎日が新しい）", face: smile }
        next: END
      - id: stayed
        lines:
          - { who: minami, kind: inner, text: "（慣れた仕事を、もっと深めていきたい）" }
        next: END

  # ───────── ユウとアオイ：パートナーシップ制度 ─────────
  - id: E30-YU-PARTNERSHIP
    age: 30
    characters: [yu]
    kind: fixed
    domains: [人権, 制度]
    statCard: [S29]
    stage: { place: home2, time: day, cast: [{ id: yu, x: 30 }, { id: aoi, x: 62 }] }
    summary: "アオイと、パートナーシップ制度のことを話した。"
    status: draft
    scenes:
      - id: start
        lines:
          - { who: aoi, text: "これからのこと、ちゃんと形にしておきたいなって。" }
          - { who: yu, kind: inner, text: "（もしものとき、家族として扱ってもらえるのかな）" }
        branches:
          - when: "flags.partnershipLocal == true"
            next: available
        next: unavailable
      - id: available
        lines:
          - { who: yu, text: "この市、パートナーシップ制度があるよね。" }
        choices:
          - id: use
            label: "「宣誓、しに行こうか」"
            neutral: true
            canonical: true
            effects:
              - { param: connection, sign: 1, size: S, source: choice, note: "制度を利用した" }
            closeness:
              - { who: aoi, delta: 1, note: "二人で宣誓した" }
            next: used
          - id: notUse
            label: "「今のままでも、いいかな」"
            neutral: true
            next: notUsed
      - id: used
        stage: { place: office, time: day, cast: [{ id: yu, x: 30 }, { id: aoi, x: 62 }] }
        lines:
          - { who: narration, text: "二人で役所に行き、宣誓をした。" }
          - { who: aoi, text: "なんか、照れるね。", face: smile }
          - { who: yu, kind: inner, text: "（帰り道、アオイが少し笑った）", face: smile }
        next: END
      - id: notUsed
        lines:
          - { who: aoi, text: "うん。制度があってもなくても、私たちは変わらないし。" }
        next: END
      - id: unavailable
        effects:
          - { param: options, sign: -1, size: S, source: society, statRef: S29, note: "住む自治体に制度がない" }
        lines:
          - { who: yu, text: "この市には、パートナーシップ制度がないんだよね。" }
          - { who: aoi, text: "病院とか、もしものときに困るかもしれない。", face: anxious }
        choices:
          - id: considerMove
            label: "「制度のある市、調べてみよう」"
            neutral: true
            effects:
              - { param: autonomy, sign: 1, size: S, source: choice, note: "暮らす場所を考えた" }
            next: considered
          - id: stay
            label: "「ここでの暮らしを、大事にしたい」"
            neutral: true
            canonical: true
            next: stayed
      - id: considered
        lines:
          - { who: narration, text: "制度のある自治体を、二人で調べ始めた。" }
          - { who: yu, kind: inner, text: "（どこで暮らすかも、二人で決めていく）" }
        next: END
      - id: stayed
        lines:
          - { who: aoi, text: "うん。ここには、二人の生活があるもんね。" }
        next: END

  # ───────── ケイ：家族と、たばこ ─────────
  - id: E30-KEI-WORK
    age: 30
    characters: [kei]
    # 付録A-18：確率ノード CH-PARTNER-WORK は24歳に移したため、この章は確率を使わない
    kind: fixed
    domains: [両立, 喫煙]
    statCard: [S21, S42]
    stage: { place: living, time: dusk, cast: [{ id: kei, x: 26 }, { id: saki, x: 52, when: "flags.keiFather == true" }, { id: keiChild, x: 72, when: "flags.keiFather == true" }] }
    summary: "家事や育児の分け方、自分の暮らし方を考えた。"
    status: draft
    scenes:
      - id: start
        lines:
          - { who: narration, text: "30歳になった。" }
        branches:
          - when: "flags.keiFather == true && flags.keiSmokes == true"
            next: smoke
          - when: "flags.keiFather == true"
            next: father
        next: single
      # ── 父親で、たばこを吸い続けている場合（付録B-33） ──
      - id: smoke
        lines:
          - { who: saki, text: "ねえ、ベランダで吸っても、部屋に煙が入ってくるの。" }
          - { who: saki, text: "子どものそばでは、やめてほしい。" }
          - { who: kei, kind: inner, text: "（……わかってた。言われる前に、どうにかしたかった）", face: sad }
        choices:
          - id: quit
            label: "「禁煙外来、今度こそ行く」"
            canonical: true
            effects:
              - { param: body, sign: 1, size: M, source: choice, statRef: S38, note: "禁煙を始めた" }
              - { param: connection, sign: 1, size: S, source: choice, note: "家族の話を受けとめた" }
            setFlags: { keiSmokes: false, keiQuit30: true }
            closeness:
              - { who: saki, delta: 1, note: "サキの話を受けとめた" }
            next: quitDone
          - id: brushOff
            label: "「外で吸ってるんだから、いいだろ」"
            effects:
              - { param: connection, sign: -1, size: S, source: choice, note: "家族の話を聞き流した" }
            closeness:
              - { who: saki, delta: -1, note: "サキの話を聞き流した" }
            next: brushOff
      - id: quitDone
        lines:
          - { who: kei, text: "禁煙外来、今度こそ行く。" }
          - { who: saki, text: "ありがとう。応援する。", face: smile }
        next: father
      - id: brushOff
        lines:
          - { who: kei, text: "外で吸ってるんだから、いいだろ。" }
          - { who: saki, text: "……そういうことじゃないんだけどな。", face: sad }
          - { who: narration, text: "やめたくなったときは、禁煙外来で相談できる。" }
        next: father
      # ── 父親になっている場合 ──
      - id: father
        lines:
          - { who: saki, text: "家のこと、そろそろ分け方を決め直さない？" }
        choices:
          - id: share
            label: "「夕食と寝かしつけは、おれがやる」"
            canonical: true
            effects:
              - { param: connection, sign: 1, size: M, source: choice, note: "家事と育児を分担した" }
            closeness:
              - { who: keiChild, delta: 1, note: "毎晩絵本を読んでいる" }
            next: shared
          - id: leave
            label: "「サキのほうが、うまいから」"
            effects:
              - { param: connection, sign: -1, size: S, source: choice, note: "家事を相手に任せた" }
            closeness:
              - { who: saki, delta: -1, note: "家のことを任せきりにした" }
            next: left
      - id: shared
        lines:
          - { who: kei, text: "夕食と寝かしつけは、おれがやる。" }
          - { who: keiChild, text: "パパ、今日の絵本これがいい！" }
          - { who: kei, kind: inner, text: "（子どもとの会話が、増えた）", face: smile }
        next: END
      - id: left
        lines:
          - { who: kei, text: "サキのほうが、うまいから。" }
          - { who: narration, text: "家のことは、サキに任せることが多くなった。" }
        next: END
      # ── 父親になっていない場合 ──
      - id: single
        lines:
          - { who: kei, kind: inner, text: "（一人の時間が増えた。暮らし方を、自分で選べるようになってきた）" }
        choices:
          - id: community
            label: "地域の子ども食堂を手伝う"
            neutral: true
            canonical: true
            effects:
              - { param: connection, sign: 1, size: S, source: choice, note: "地域の活動に参加した" }
            next: community
          - id: myTime
            label: "一人の時間を大切にする"
            neutral: true
            effects:
              - { param: autonomy, sign: 1, size: S, source: choice, note: "自分の時間を選んだ" }
            next: myTime
      - id: community
        lines:
          - { who: narration, text: "地域の子ども食堂を、手伝い始めた。" }
          - { who: kei, kind: inner, text: "（昔の自分みたいな子どもたちと、話すのが楽しい）", face: smile }
        next: END
      - id: myTime
        lines:
          - { who: kei, kind: inner, text: "（休みの日は、一人で出かける。誰かのためじゃない時間）", face: smile }
        next: END
