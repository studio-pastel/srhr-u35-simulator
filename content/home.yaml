# トップページ（付録B-46）。Claude Code の下書き。
# big は stats.yaml の value にある数字だけを書ける（npm run validate で検査する）。文は各統計の cardText を出す。
status: draft
catch: "あなたのからだのことを、決めるのは誰だろう。"
lead: "恋愛、妊娠、仕事、病気。生まれてから35歳までの誰かの人生を生きて、からだの自己決定権とライフステージを体感するゲームです。"
themes:
  - title: "からだのことを、自分で決められる？"
    body: "性のこと、避妊、受診、ワクチン。自分のからだのことなのに、親や相手や周りの空気で決まってしまう場面があります。"
    play: "ゲームでは、その場面で何を言い、どうするかを、あなたが選びます。"
    stats:
      - { id: S02, big: "55.7%" }
      - { id: S32, big: "42.0%" }
      - { id: S13, big: "55.1%" }
  - title: "人生の時期で、何が変わる？"
    body: "若いころの食事や受診が、何年もあとの健康や妊娠につながることがあります。子どもを望む人にも、望まない人にも関わることです。"
    play: "年を重ねながら、あのときの選択や偶然がどう響くかをたどります。"
    stats:
      - { id: S14, big: "20.2%" }
      - { id: S16, big: "4.4組に1組" }
      - { id: S17, big: "29.6%" }
  - title: "生まれた条件で、どこまで変わる？"
    body: "性別、家計、家庭。選べなかったことで、同じ努力をしても結果が変わることがあります。"
    play: "主人公はランダムに決まります。2周目は、偶然はそのままに条件だけ変えて、差を見比べられます。"
    stats:
      - { id: S43, big: "76.6" }
      - { id: S47, big: "7時間28分" }
      - { id: S22, big: "44.7%" }
explain:
  - title: "SRHRとは"
    body: "Sexual and Reproductive Health and Rights の略で、日本語では「性と生殖に関する健康と権利」です。自分のからだや性について、正しい情報とケアを得られること。誰と関係を持つか、子どもを持つか持たないかを、自分で決められること。性別や性的指向にかかわらず、すべての人の権利です。"
  - title: "プレコンセプションケアとは"
    body: "「性別を問わず、適切な時期に、性や健康に関する正しい知識を持ち、妊娠・出産を含めたライフデザイン（将来設計）や将来の健康を考えて健康管理を行う取り組み」です。妊娠を望む人だけのものではありません。"
    source: { label: "こども家庭庁「はじめよう プレコンセプションケア」", url: "https://precon.cfa.go.jp/" }
