# 19歳の章（SPEC.md §10.3）。会話中心の形式（付録B-2）。Claude Code の下書き。すべて status: draft。
#
# 文字数の上限（src/engine/limits.ts）
#   吹き出し lines[].text …… 40字以内（超えると警告）
#   選択肢 label ………………… 30字以内（超えると警告）
#   効果 note ………………………… 20字以内（超えるとエラー。ビルドが止まる）
#   とばしたときの要約 summary … 40字以内（超えると警告）
#
# ハルトの行動の決め方（付録B-12〜B-15・B-32）
#   ハルト以外の人物で遊ぶときは、ハルトの暴力が身体的・性的なものに進むかを確率ノード CH-HARUTO19 で決める
#   （「ハルトの決定（統計にもとづく）」）。確率を変える要因は、ハルトの生育条件と社会条件だけ（P7）。
#   ハルトで遊ぶときは、プレイヤーの選択（h-choose）で決まる。どちらの場合も harutoRoute に結果を残し、
#   相手の側の場面は、そのフラグで続きを合わせる。
#
# 性交渉の場面（付録B-30）：行為は描かず、前後の会話と暗転で描く。暴力の行為も描かない（P4）。
age: 19
title: "19歳"
season: "春"
status: draft
intro:
  minami: "大学1年の春。ハルトとは、別々の大学に進んでからも付き合っている。"
  haruto: "大学1年の春。ミナミとは、別々の大学に進んでからも付き合っている。"
  yu: "大学1年の春。軽音サークルに入って、毎日が少し忙しい。"
  kei: "高校を卒業して、働き始めた。休みの日には、交際しているサキと会う。"
events:
  # ───────── ミナミとハルト：19歳 ─────────
  - id: E19-MH-ESCALATE
    age: 19
    characters: [minami, haruto]
    kind: chance
    domains: [対人暴力, 避妊]
    viewpointSwitch:
      from: minami
      to: haruto
      entry: { minami: m-start, haruto: h-start }
    statCard: [S07, S01, S04, S37]
    resources: [violence]
    stage: { place: campus, time: dusk, cast: [{ id: minami, x: 34, pose: phone }] }
    summary: "別々の大学に進んだハルトとの関係が、変わっていった。"
    status: draft
    scenes:
      # ── ミナミの視点 ──
      - id: m-start
        viewpoint: minami
        effects:
          - { param: connection, sign: -1, size: M, source: others, statRef: S07, note: "束縛が続いている" }
        lines:
          - { who: narration, text: "別々の大学に進んで、会えるのは週末だけになった。" }
          - { who: haruto, kind: message, text: "今日、誰といた？" }
          - { who: haruto, kind: message, text: "サークルの飲み会とか、行かないでほしい。" }
          - { who: minami, kind: inner, text: "（高校のころと、変わらない）", face: anxious }
        # ハルトで遊んだときは、ハルトの選択の結果に合わせる（ミナミで遊ぶときは、ここで確率を決める）
        branches:
          - when: "flags.harutoRoute == 'continued'"
            next: m-escalated
          - when: "flags.harutoRoute == 'stopped'"
            next: m-calm
        next: m-chance
      - id: m-chance
        viewpoint: minami
        lines:
          - { who: minami, kind: inner, text: "（この先、ハルトはどうなっていくんだろう）" }
        chance:
          id: CH-HARUTO19
          label: "ハルトの暴力が、身体的・性的なものに進む確率"
          actorLabel: "ハルトの決定"
          # 付録B-35：S07 の「干渉・精神的暴力だけ」66.9〜77.0% の残り（23.0〜33.1%）のうち、低いほうの値。
          # 19歳のミナミに合う群（大学生の女性）の値は、白書で確かめたら差し替える（残務 T19）
          base: { value: 0.23, statRef: S07 }
          modifiers:
            # ハルトの生育条件は固定（characters.yaml：witnessedDV: true）。誰で遊んでも必ずかかる
            - { when: "true", op: odds, value: 1.92, source: upbringing, statRef: S36, note: "ハルトが親の暴力を見て育った" }
            - { when: "cond.sexEducation == 'taught'", op: odds, value: 0.75, source: society, statRef: S37, note: "学校でデートDVを学んだ" }
          outcomes:
            happens: { setFlags: { harutoRoute: continued }, next: m-escalated }
            notHappens: { setFlags: { harutoRoute: stopped }, next: m-calm }

      # 暴力が身体的・性的なものに進んだ。行為は描かず、そのあとの気持ちを描く（P4）
      - id: m-escalated
        viewpoint: minami
        effects:
          - { param: connection, sign: -1, size: L, source: others, statRef: S04, note: "交際相手からの暴力" }
          - { param: living, sign: -1, size: M, source: others, statRef: S04, note: "避妊に協力してもらえない" }
        lines:
          - { who: narration, text: "予定を断った日から、ハルトの態度は、もっと強くなった。" }
          - { who: minami, kind: inner, text: "（避妊してって言っても、聞いてもらえない）", face: sad }
          - { who: minami, kind: inner, text: "（……私が、何か間違えたのかな）" }
          - { who: narration, text: "ハルトの言葉や行動を決めているのは、ミナミではない。" }
        branches:
          - when: "flags.knowsHelplines == true"
            next: m-know
        next: m-choose
      - id: m-know
        viewpoint: minami
        lines:
          - { who: minami, kind: inner, text: "（高校でもらったカード。相談窓口の番号が、並んでた）" }
        next: m-choose
      - id: m-choose
        viewpoint: minami
        lines:
          - { who: narration, text: "ミナミは、スマホを手に取る。" }
        choices:
          - id: helpline
            label: "相談窓口に連絡する"
            canonical: true
            effects:
              - { param: connection, sign: 1, size: S, source: choice, note: "相談窓口に連絡した" }
              - { param: living, sign: 1, size: S, source: society, when: "flags.knowsHelplines == true", note: "授業で相談先を知った" }
            setFlags: { minamiResponse19: helpline }
            next: m-helpline
          - id: friend
            label: "リコに話す"
            effects:
              - { param: connection, sign: 1, size: M, source: choice, note: "友人に話した" }
            setFlags: { minamiResponse19: toldFriend }
            closeness:
              - { who: riko, delta: 1, note: "リコに話した" }
            next: m-friend
          - id: notYet
            label: "今は、誰にも話さない"
            setFlags: { minamiResponse19: notYet }
            next: m-notyet
      - id: m-helpline
        viewpoint: minami
        effects:
          - { param: connection, sign: 1, size: M, source: others, note: "相談員が話を聞いた" }
          - { param: living, sign: 1, size: S, source: others, note: "安全の計画を考えた" }
        lines:
          - { who: counselor, text: "話してくれて、ありがとうございます。" }
          - { who: counselor, text: "あなたのせいではありません。" }
          - { who: counselor, text: "これからの安全のこと、いっしょに考えましょう。" }
          - { who: minami, kind: inner, text: "（……ひとりじゃ、なかった）", face: relieved }
        next: END
      - id: m-friend
        viewpoint: minami
        effects:
          - { param: connection, sign: 1, size: S, source: others, note: "友人が受け止めた" }
        lines:
          - { who: riko, kind: message, text: "話してくれて、よかった。" }
          - { who: riko, kind: message, text: "相談できるところ、いっしょに調べよう。" }
          - { who: minami, kind: inner, text: "（リコに話して、よかった）", face: relieved }
        next: END
      - id: m-notyet
        viewpoint: minami
        lines:
          - { who: minami, kind: inner, text: "（今は、まだ誰にも言えない）" }
          - { who: narration, text: "話すかどうか、いつ話すかは、ミナミが決めていい。" }
        next: END

      # 暴力が激しくならなかった。ハルトは自分の言動を振り返り、謝る。二人は復縁しない（付録B-32）
      - id: m-calm
        viewpoint: minami
        lines:
          - { who: narration, text: "ある夜、ハルトから長いメッセージが来た。" }
          - { who: haruto, kind: message, text: "これまで、スマホを見せろとか、予定を決めつけたりして、ごめん。" }
          - { who: haruto, kind: message, text: "あれは「心配」じゃなくて、ミナミを縛ってた。父さんと同じことをしてた。" }
          - { who: haruto, kind: message, text: "大学の相談室に通ってる。自分の問題として、向き合っていく。" }
          - { who: minami, kind: inner, text: "（……ちゃんと、自分のこととして話してる）" }
          - { who: minami, kind: inner, text: "（でも、私の気持ちは、もう戻らない）" }
        next: m-decide
      - id: m-decide
        viewpoint: minami
        lines:
          - { who: minami, kind: inner, text: "（別れることを、どう伝えよう）" }
        choices:
          - id: tell
            label: "「話してくれてありがとう。でも、別れたい」"
            canonical: true
            effects:
              - { param: autonomy, sign: 1, size: M, source: choice, note: "別れると自分で決めた" }
            setFlags: { minamiResponse19: brokeUp }
            closeness:
              - { who: haruto, end: true, note: "別れた" }
            next: m-tell
          - id: riko
            label: "リコに話してから、伝える"
            effects:
              - { param: autonomy, sign: 1, size: M, source: choice, note: "別れると自分で決めた" }
              - { param: connection, sign: 1, size: S, source: choice, note: "友人に話した" }
            setFlags: { minamiResponse19: brokeUpWithFriend }
            closeness:
              - { who: riko, delta: 1, note: "リコに話した" }
              - { who: haruto, end: true, note: "別れた" }
            next: m-riko
      - id: m-tell
        viewpoint: minami
        lines:
          - { who: minami, kind: message, text: "話してくれて、ありがとう。でも、別れたい。" }
          - { who: haruto, kind: message, text: "わかった。ミナミが決めたことだから。いままで、ほんとうにごめん。" }
          - { who: minami, kind: inner, text: "（謝ってもらっても、戻らなくていい。決めるのは、私だ）", face: relieved }
        next: END
      - id: m-riko
        viewpoint: minami
        stage: { place: campus, time: day, cast: [{ id: minami, x: 30 }, { id: riko, x: 64 }] }
        effects:
          - { param: connection, sign: 1, size: S, source: others, note: "友人が受け止めた" }
        lines:
          - { who: riko, text: "謝ってくれたからって、戻らなきゃいけないわけじゃないよ。" }
          - { who: minami, kind: inner, text: "（……うん。そうだよね）", face: relieved }
          - { who: minami, kind: message, text: "話してくれて、ありがとう。でも、別れたい。" }
          - { who: haruto, kind: message, text: "わかった。いままで、ほんとうにごめん。" }
        next: END

      # ── ハルトの視点 ──
      - id: h-start
        viewpoint: haruto
        lines:
          - { who: narration, text: "別々の大学に進んで、会えるのは週末だけになった。" }
          - { who: haruto, kind: inner, text: "（ミナミが、知らない人と笑ってるかもしれない）", face: anxious }
        # ミナミで遊んだときは、確率（ハルトの決定）の結果に合わせて続きを見せる
        branches:
          - when: "char != 'haruto' && flags.harutoRoute == 'continued'"
            next: h-escalated
          - when: "char != 'haruto' && flags.harutoRoute == 'stopped'"
            next: h-calm
        next: h-anger
      - id: h-anger
        viewpoint: haruto
        effects:
          - { param: autonomy, sign: -1, size: S, source: upbringing, statRef: S04, when: "up.witnessedDV == true", note: "支配を見て育った" }
        lines:
          - { who: minami, kind: message, text: "週末は、サークルの集まりがあるから会えない。" }
          - { who: haruto, kind: inner, text: "（……思いどおりにならないと、強い言葉が出そうになる）" }
          - { who: haruto, kind: inner, text: "（避妊の話をされると、責められてる気がする）" }
        next: h-think
      - id: h-think
        viewpoint: haruto
        lines:
          - { who: haruto, kind: inner, text: "（怒鳴っていた父さんの顔が浮かぶ。自分は、父さんとは違うはずだった）" }
        branches:
          - when: "flags.knowsDateDV == true"
            next: h-know
        next: h-choose
      - id: h-know
        viewpoint: haruto
        lines:
          - { who: haruto, kind: inner, text: "（授業で聞いた。避妊に協力しないことも、暴力になりうる）" }
        next: h-choose
      - id: h-choose
        viewpoint: haruto
        lines:
          - { who: haruto, kind: inner, text: "（……おれは、どうする？）" }
        choices:
          - id: reflect
            label: "自分の言動を振り返る"
            effects:
              - { param: autonomy, sign: 1, size: M, source: choice, note: "自分の言動を振り返った" }
            setFlags: { harutoRoute: stopped }
            next: h-reflect
          - id: blame
            label: "「ミナミが悪いんだ」"
            canonical: true
            effects:
              - { param: connection, sign: -1, size: M, source: choice, note: "関係がこじれていく" }
            setFlags: { harutoRoute: continued }
            next: h-blame
      - id: h-reflect
        closeness:
          - { who: minami, end: true, note: "別れた" }
        viewpoint: haruto
        lines:
          - { who: haruto, kind: inner, text: "（あれは「心配」じゃない。ミナミを縛ってた。父さんと同じことだった）", face: sad }
          - { who: haruto, kind: inner, text: "（言葉にすると、足元が揺れる。それでも、ここで止める）" }
          - { who: haruto, kind: message, text: "これまで、スマホを見せろとか、予定を決めつけたりして、ごめん。" }
          - { who: minami, kind: message, text: "話してくれて、ありがとう。でも、別れたい。" }
          - { who: haruto, kind: inner, text: "（引き止めない。それが、いまのおれにできること）" }
          - { who: haruto, kind: message, text: "わかった。いままで、ほんとうにごめん。" }
        next: END
      - id: h-blame
        viewpoint: haruto
        lines:
          - { who: haruto, kind: inner, text: "（ミナミが悪いんだ）" }
          - { who: haruto, kind: inner, text: "（そう思えば、自分を見なくて済む）" }
        next: END
      - id: h-escalated
        viewpoint: haruto
        lines:
          - { who: haruto, kind: inner, text: "（思いどおりにならないと、強い言葉が出る）" }
          - { who: haruto, kind: inner, text: "（避妊の話をされると、責められてる気がして、聞き流した）" }
          - { who: haruto, kind: inner, text: "（ミナミが悪いんだ。そう思えば、自分を見なくて済む）" }
        next: END
      - id: h-calm
        viewpoint: haruto
        lines:
          - { who: haruto, kind: inner, text: "（このままだと、父さんと同じになる）", face: sad }
          - { who: haruto, kind: inner, text: "（大学の相談室に行こう。自分の問題として、向き合う）" }
          - { who: haruto, kind: message, text: "これまで、スマホを見せろとか、予定を決めつけたりして、ごめん。" }
          - { who: haruto, kind: inner, text: "（許してもらうためじゃない。ミナミがどう決めても、受けとめる）" }
        next: END

  # ───────── ケイとサキ：避妊を二人で決める（付録B-30） ─────────
  - id: E19-KS-CONTRACEPTION
    age: 19
    characters: [kei]
    kind: chance
    domains: [避妊, 緊急避妊]
    statCard: [S25, S26, S11]
    resources: [ec]
    stage: { place: bedroom, time: night, cast: [{ id: kei, x: 30 }, { id: saki, x: 62 }] }
    summary: "サキと避妊のことを話した。この1年に、避妊のトラブルが起きるかどうか。"
    status: draft
    scenes:
      - id: start
        lines:
          - { who: narration, text: "働きながら、家のことも手伝う毎日。" }
          - { who: kei, kind: inner, text: "（サキと会える時間は短い。でも、いっしょにいると落ち着く）", face: smile }
          - { who: saki, text: "ねえ、ケイ。ちゃんと話しておきたいことがあって。" }
          - { who: saki, text: "避妊のこと、どうする？" }
        choices:
          - id: ask
            label: "「サキは、どうしたい？」"
            canonical: true
            effects:
              - { param: autonomy, sign: 1, size: M, source: choice, note: "避妊を二人で決めた" }
              - { param: connection, sign: 1, size: M, source: choice, note: "相手の考えを聞いた" }
            setFlags: { method: condom }
            closeness:
              - { who: saki, delta: 1, note: "二人で避妊を決めた" }
            next: ask
          - id: condom
            label: "「毎回、コンドームを使おう」"
            effects:
              - { param: autonomy, sign: 1, size: M, source: choice, note: "避妊を二人で決めた" }
            setFlags: { method: condom }
            closeness:
              - { who: saki, delta: 1, note: "安心させられた" }
            next: condom
          - id: withdrawal
            label: "「外に出せば、大丈夫だよ」"
            requires: "flags.method == 'withdrawal'"
            next: withdrawal
      - id: ask
        lines:
          - { who: saki, text: "コンドームは、毎回使ってほしい。" }
          - { who: saki, text: "ピルのことも、婦人科で聞いてみようかなって。" }
          - { who: kei, text: "うん。わかった。いっしょに調べよう。" }
          - { who: kei, kind: inner, text: "（話してよかった。二人のことだから）" }
        next: together
      - id: condom
        lines:
          - { who: kei, text: "毎回、コンドームを使おう。" }
          - { who: saki, text: "うん。そう言ってくれて、安心した。", face: smile }
        next: together
      - id: withdrawal
        lines:
          - { who: kei, text: "外に出せば、大丈夫だよ。" }
          - { who: saki, text: "……そうなの？", face: anxious }
          - { who: kei, kind: inner, text: "（友だちもそう言ってたし）" }
        next: together
      - id: together
        lines:
          - { who: narration, kind: fade, text: "――" }
          - { who: kei, kind: inner, text: "（サキといると、安心する）", face: smile }
        next: trouble
      - id: trouble
        lines:
          - { who: narration, text: "二人で過ごす時間が増えた、この1年。" }
        chance:
          id: CH-CONTRACEPTION
          label: "この1年に、避妊のトラブルで妊娠に至りうる出来事が起きる確率"
          base: { value: 0.13, statRef: S25 }
          modifiers:
            - { when: "flags.method == 'withdrawal'", op: set, value: 0.2, source: choice, statRef: S25, note: "腟外射精で避妊していた" }
          outcomes:
            happens: { next: notice }
            notHappens: { setFlags: { pregnant: false }, next: noTrouble }
      - id: noTrouble
        lines:
          - { who: narration, text: "この1年、避妊のトラブルは起きなかった。" }
        next: END
      - id: notice
        lines:
          - { who: narration, text: "ある夜のこと。" }
        branches:
          - when: "flags.method == 'withdrawal' && flags.knowsWithdrawalUnreliable != true"
            next: unaware
          - when: "flags.method == 'withdrawal'"
            next: awareW
        next: awareC
      - id: unaware
        lines:
          - { who: kei, kind: inner, text: "（外に出したから、大丈夫なはず）" }
          - { who: narration, text: "ケイもサキも、そう思っていた。" }
        next: ec
      - id: awareW
        lines:
          - { who: kei, kind: inner, text: "（外に出したつもりだった。でも、それは確実な避妊じゃない）", face: anxious }
        next: ecAsk
      - id: awareC
        lines:
          - { who: saki, text: "……ねえ、コンドーム、破れてない？", face: anxious }
          - { who: kei, kind: inner, text: "（……ほんとだ）", face: anxious }
        next: ecAsk
      - id: ecAsk
        lines:
          - { who: saki, text: "緊急避妊薬って、72時間以内だよね。" }
        choices:
          - id: use
            label: "「いっしょに買いに行こう」"
            canonical: true
            setFlags: { usedEC: true }
            next: getEC
          - id: wait
            label: "「たぶん、大丈夫だよ」"
            setFlags: { usedEC: false }
            next: ec
      - id: getEC
        lines:
          - { who: narration, text: "二人で、どこで手に入るかを調べた。" }
        branches:
          - when: "cond.ecAccess == 'prescriptionOnly'"
            next: clinic
        next: pharmacy
      - id: clinic
        effects:
          - { param: autonomy, sign: -1, size: S, source: society, statRef: S11, note: "受診しないと買えない" }
        lines:
          - { who: narration, text: "この頃は、受診して処方を受けないと買えなかった。" }
          - { who: kei, kind: inner, text: "（仕事を抜けて、開いている病院を探すしかない）" }
        next: costCheck
      - id: pharmacy
        lines:
          - { who: narration, text: "近くの薬局で、薬剤師に相談した。" }
          - { who: narration, text: "処方箋はいらず、サキは薬剤師の前で薬を飲んだ。" }
        next: costCheck
      - id: costCheck
        lines:
          - { who: narration, text: "薬を受け取って、店を出た。" }
        branches:
          - when: "up.economy == 'hardship'"
            next: cost
        next: ec
      - id: cost
        effects:
          - { param: autonomy, sign: -1, size: S, source: upbringing, statRef: S11, note: "薬代7,480円の負担" }
        lines:
          - { who: kei, kind: inner, text: "（7,480円。今月の家計には、小さくない）" }
          - { who: narration, text: "二人で出し合って払った。" }
        next: ec
      - id: ec
        lines:
          - { who: narration, text: "あとは、結果を待つしかない。" }
        chance:
          id: CH-EC
          label: "妊娠が成立する確率"
          base: { value: 1.0, statRef: S25 }
          modifiers:
            - { when: "flags.usedEC == true", op: mul, value: 0.16, source: choice, statRef: S26, note: "緊急避妊薬を使った" }
          outcomes:
            happens: { setFlags: { pregnant: true }, next: pregnant }
            notHappens: { setFlags: { pregnant: false }, next: notPregnant }
      - id: pregnant
        lines:
          - { who: saki, kind: message, text: "妊娠してるみたい。" }
          - { who: kei, kind: inner, text: "（……）", face: anxious }
        next: END
      - id: notPregnant
        lines:
          - { who: saki, kind: message, text: "月経、来たよ。" }
          - { who: kei, kind: message, text: "よかった。これからのこと、また話そう。" }
        next: END

